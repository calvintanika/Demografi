<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HCaja · Performance Hub &amp; Talent Passport</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --magenta:#ED0677; --magenta-d:#C4045F; --pink:#F6AABF; --pink-t:#FDEDF3;
  --yellow:#FFCB05; --yellow-t:#FFF6D1; --blue:#496AAA; --blue-t:#E9EEF7;
  --ink:#3B2C2F; --maroon:#841945; --muted:#7D6E72; --faint:#B3A6AA;
  --bg:#F8F5F6; --surface:#FFFFFF; --surface-2:#FBF8F9; --line:#EEE4E8;
  --r:14px; --shadow:0 1px 3px rgba(59,44,47,.06),0 6px 20px rgba(59,44,47,.04);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.55 "Anteraja Sans","Poppins",Montserrat,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:236px 1fr;height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto}
.logos{display:flex;align-items:center;gap:12px;padding:2px 8px 20px}
.logos img{display:block;height:30px;width:auto}
.logos .sep{width:1px;height:26px;background:var(--line)}
.nav-group{font-size:12px;color:var(--muted);padding:6px 10px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;color:var(--ink);border-radius:10px;cursor:pointer;text-align:left;font-weight:500;margin-bottom:2px}
.nav-item svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav-item:hover{background:var(--pink-t)}
.nav-item.active{background:var(--magenta);color:#fff;font-weight:600}
.nav-item.active svg{color:#fff}
.nav-item .count{margin-left:auto;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:700;border-radius:99px;padding:0 7px}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 26px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs b{color:var(--ink);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.seg{display:inline-flex;background:var(--pink-t);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:600;color:var(--maroon);font-size:12px;white-space:nowrap}
.seg button.on{background:var(--magenta);color:#fff}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff;background:var(--magenta);flex:none}
.avatar.lg{width:48px;height:48px;font-size:16px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.burger{display:none}
.content{flex:1;overflow-y:auto;padding:26px}
.wrap{max-width:1180px;margin:0 auto}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:12px}
.mt{margin-top:16px}.mt-s{margin-top:8px}.mb{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:var(--magenta);color:#fff;padding:9px 18px;border-radius:99px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--magenta-d)}
.btn.ghost{background:var(--surface);color:var(--magenta);border-color:var(--magenta)}
.btn.ghost:hover{background:var(--pink-t)}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.yellow:hover{filter:brightness(.96)}
.btn.sm{padding:5px 13px;font-size:12px}
.btn.link{background:none;color:var(--magenta);padding:4px 0;border:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.green,.chip.navy{background:var(--blue-t);color:var(--blue);border-color:transparent}
.chip.amber{background:var(--yellow-t);color:#8A6A00;border-color:transparent}
.chip.orange,.chip.pink{background:var(--pink-t);color:var(--magenta);border-color:transparent}
.chip.red{background:#F6E3EA;color:var(--maroon);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.stat .d{font-size:12px;color:var(--muted)}
.up{color:var(--blue)!important} .down{color:var(--maroon)!important}
.bar{height:8px;border-radius:99px;background:var(--pink-t);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--magenta);border-radius:99px}
.bar.blue>i{background:var(--blue)} .bar.yellow>i{background:var(--yellow)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--magenta);border-bottom-color:var(--magenta)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--surface);padding:5px 13px;border-radius:99px;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted)}
.pills button.on{background:var(--magenta);border-color:var(--magenta);color:#fff}
.pills button span{opacity:.75;margin-left:4px}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);background:var(--surface-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--pink-t)}
td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.who .avatar{width:30px;height:30px;font-size:11px}
.who b{display:block;font-weight:600}
.who small{color:var(--muted);font-size:12px}
.tech td{font-size:12px;color:var(--muted);background:var(--surface-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
td input.inp{width:90px;padding:5px 8px;text-align:right;font-weight:600}

/* hero — HCaja banner style */
.hero{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(120deg,#ED0677 0%,#F2479A 60%,#F6AABF 130%);color:#fff;padding:26px 28px;min-height:230px;display:flex;align-items:center}
.hero .curves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .burst{position:absolute;right:48px;top:50%;transform:translateY(-50%);width:250px;height:250px;pointer-events:none}
.hero .char{position:absolute;right:26px;bottom:0;height:92%;max-width:40%;object-fit:contain;object-position:bottom right;pointer-events:none}
.hero-in{position:relative;max-width:60%}
.hero-in .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:99px}
.hero h1{color:#fff;font-size:26px;margin-top:10px}
.hero .score{display:flex;align-items:baseline;gap:12px;margin-top:12px;flex-wrap:wrap}
.hero .score b{font-size:46px;font-weight:800;line-height:1}
.hero .score small{font-size:15px;opacity:.9}
.hero .tag{background:var(--yellow);color:var(--ink);font-weight:700;font-size:12px;padding:3px 12px;border-radius:99px}
.hero .minis{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hero .mini{background:rgba(255,255,255,.18);border-radius:12px;padding:7px 14px;font-size:12px}
.hero .mini b{display:block;font-size:17px}

/* journey strip */
.journey{display:flex;align-items:center;gap:0;overflow-x:auto;padding:4px 2px}
.j-step{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);min-width:76px;flex:1}
.j-node{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--pink);background:var(--surface);font-size:11px;font-weight:700;color:var(--magenta)}
.j-step.done .j-node{background:var(--magenta);border-color:var(--magenta);color:#fff}
.j-step.now .j-node{background:var(--yellow);border-color:var(--yellow);color:var(--ink);box-shadow:0 0 0 5px var(--yellow-t)}
.j-step.now{color:var(--ink)}
.j-line{flex:1;height:3px;background:var(--pink);border-radius:9px;min-width:12px;margin-bottom:22px}
.j-line.done{background:var(--magenta)}

/* action list */
.act{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--pink-t);color:var(--magenta)}
.act-ic svg{width:17px;height:17px}
.act.done .act-ic{background:var(--blue-t);color:var(--blue)}
.act-main{flex:1;min-width:0}
.act-main b{display:block;font-weight:600}
.act.done .act-main b{color:var(--muted)}

/* workspace */
.stepper{display:flex;gap:8px;margin-top:18px;overflow-x:auto}
.st{flex:1;min-width:120px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center}
.st i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--pink-t);color:var(--magenta);flex:none}
.st b{display:block;font-size:13px}
.st small{font-size:11px;color:var(--muted)}
.st.done i{background:var(--blue);color:#fff}
.st.prog i{background:var(--yellow);color:var(--ink)}
.st.on{border-color:var(--magenta);box-shadow:0 0 0 3px var(--pink-t)}
.score-badge{display:inline-grid;place-items:center;min-width:40px;padding:2px 8px;border-radius:99px;font-weight:700;background:var(--pink-t);color:var(--magenta);font-variant-numeric:tabular-nums}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.tile.hl{background:var(--yellow-t);border-color:var(--yellow)}
.big{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:14px;color:var(--muted);font-weight:500}
.beh{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.4fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.beh:last-child{border-bottom:0}
input[type=range]{width:100%;accent-color:var(--magenta)}
.foot-bar{position:sticky;bottom:0;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:10px 12px 10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow)}
.rate{display:flex;gap:4px}
.rate button{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:12px}
.rate button.on{background:var(--magenta);color:#fff;border-color:var(--magenta)}
textarea,.inp{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical}
textarea:focus,.inp:focus{outline:2px solid var(--pink-t);border-color:var(--magenta)}
textarea[readonly]{background:var(--surface-2)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
label.f small{font-weight:400;color:var(--muted)}
.formula{background:var(--yellow-t);border-radius:12px;padding:12px 16px;font-size:13px}
.formula code{font-family:inherit;font-weight:700;color:var(--magenta)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--blue-t);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:13px}
.note svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--blue)}
.quote{border-left:3px solid var(--pink);padding:4px 12px;margin:10px 0;font-size:13px}
.quote small{display:block;color:var(--muted);margin-top:2px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--yellow-t);border:1px solid var(--yellow);font-size:13px;flex-wrap:wrap}

.ba{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:center}
.ba .tile{text-align:center}
.ba .arrow{color:var(--magenta);font-size:20px;font-weight:700}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 14px}
.tl-i::before{content:"";position:absolute;left:-20px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--pink)}
.tl-i.green::before{background:var(--blue);border-color:var(--blue)}
.tl-i.navy::before{border-color:var(--blue)} .tl-i.pink::before,.tl-i.orange::before{border-color:var(--magenta)}
.tl-i b{font-size:13px;font-weight:600}
.tl-i p{font-size:12px;color:var(--muted)}

.wiz{display:grid;grid-template-columns:220px 1fr;gap:16px}
.wiz-nav{display:flex;flex-direction:column;gap:2px}
.wiz-nav button{display:flex;gap:10px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500;font-size:13px}
.wiz-nav button i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--pink-t);color:var(--magenta);flex:none;font-weight:700}
.wiz-nav button.done i{background:var(--blue);color:#fff}
.wiz-nav button.on{background:var(--pink-t);color:var(--ink);font-weight:600}
.wiz-nav button.on i{background:var(--magenta);color:#fff}
.toggle{position:relative;width:38px;height:22px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--line);cursor:pointer;transition:.2s}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle input:checked+span{background:var(--magenta)}
.toggle input:checked+span::after{transform:translateX(16px)}
.toggle input:disabled+span{opacity:.6}
.opt{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.flow-i{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.flow-i.off{opacity:.45}
.flow-i .n{width:24px;height:24px;border-radius:50%;background:var(--pink-t);color:var(--magenta);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.map div{border-radius:10px;padding:10px 12px;font-size:12px;background:var(--pink-t);color:var(--muted)}
.map b{display:block;font-size:13px;color:var(--ink)}

.scrim{position:fixed;inset:0;background:rgba(59,44,47,.45);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:18px;width:min(600px,100%);max-height:90vh;overflow-y:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.wide{width:min(820px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-weight:600;font-size:13px;z-index:60;display:flex;gap:8px;align-items:center}
.toast i{color:var(--yellow);font-style:normal}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
svg text{font-family:inherit}
.chart{width:100%;height:auto;display:block}
.done-state{text-align:center;padding:10px}
.done-state img{height:150px}

@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(59,44,47,.4)}
  .burger{display:grid}
  .g2,.g3{grid-template-columns:1fr}
  .wiz{grid-template-columns:1fr} .wiz-nav{flex-direction:row;overflow-x:auto} .wiz-nav button{white-space:nowrap}
  .top{padding:10px 14px}
  .top .who-top,.crumbs{display:none}
  .content{padding:16px}
  .hero-in{max-width:100%} .hero .char,.hero .burst{display:none}
  .beh{grid-template-columns:1fr}
  .ba{grid-template-columns:1fr}.ba .arrow{transform:rotate(90deg);text-align:center}
  .foot-bar{border-radius:14px}
}
@media (max-width:560px){.g4,.g5{grid-template-columns:1fr 1fr}.seg button{padding:6px 9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* project milestones */
.ms{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding:8px 10px;background:var(--surface-2);border-radius:10px}
.ms-i{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12px;font-weight:500;cursor:pointer}
.ms-i input{accent-color:var(--magenta)}
.ms-i small{color:var(--muted)}
.ms-i.later{opacity:.55}
.persona{width:auto;max-width:280px;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2)}
@media (max-width:700px){.persona{max-width:150px}}
/* talent outputs */
.report-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:3px solid var(--magenta)}
.hav-map{display:grid;grid-template-columns:22px 1fr;grid-template-rows:1fr auto;gap:6px}
.hav-axis-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.hav-axis-x{grid-column:2;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.hav-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hav-q{border-radius:12px;padding:12px;min-height:160px;display:flex;flex-direction:column;gap:6px}
.hav-names{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.hav-names span{background:#fff;border-radius:99px;padding:2px 10px;font-size:12px;cursor:pointer}
.hav-names span:hover{color:var(--magenta)}
/* Agendaja calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0}
.cal-d{min-height:92px;border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface);min-width:0}
.cal-d.off{background:transparent;border-color:transparent}
.cal-d.today{border-color:var(--magenta);box-shadow:0 0 0 2px var(--pink-t)}
.cal-n{font-size:11px;font-weight:600;color:var(--muted)}
.cal-d.today .cal-n{color:#fff;background:var(--magenta);border-radius:99px;width:20px;height:20px;display:grid;place-items:center}
.cal-e{border:0;text-align:left;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;cursor:pointer;background:var(--c);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-e[style*="#FFCB05"]{color:var(--ink)}
.cal-e.pub{background:transparent;color:var(--ink);border:1.5px dashed var(--c)}
.ev-card h3{font-size:15px}
.ticket{max-width:320px;margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.ticket-top{background:linear-gradient(120deg,#ED0677,#F2479A);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:12px;font-weight:600}
.ticket-body{padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border-top:2px dashed var(--line)}
.scanner{background:#1f1a1b;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:14px;color:#ddd;font-size:13px;text-align:center}
.scan-frame{width:170px;height:170px;border:3px solid var(--yellow);border-radius:18px;position:relative;overflow:hidden}
.scan-frame span{position:absolute;left:8px;right:8px;height:2px;background:var(--magenta);box-shadow:0 0 10px var(--magenta);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%{top:10px}50%{top:150px}100%{top:10px}}
.mail{border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:620px;margin:0 auto}
.mail-hero{background:linear-gradient(120deg,#ED0677,#F2479A 70%,#F6AABF);padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.mail-body{padding:20px 22px;font-size:14px}
.mail-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;background:var(--pink-t);border-radius:12px;padding:12px;font-size:13px}
.mail-info b{display:block;font-size:11px;color:var(--magenta)}
.mail-qr{display:flex;gap:18px;align-items:center;border:2px dashed var(--pink);border-radius:14px;padding:14px}
.swatch input{display:none}.swatch span{display:block;width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.swatch input:checked+span{border-color:var(--ink)}
.qrow{display:grid;grid-template-columns:24px 1fr auto auto;gap:8px;align-items:center;margin-top:8px}
.qrow .n{font-weight:700;color:var(--magenta);font-size:12px}
.sq{padding:12px 0;border-bottom:1px solid var(--line)}
.nps-bar{display:flex;height:26px;border-radius:8px;overflow:hidden;font-size:11px;font-weight:700;color:#fff}
.nps-bar span{display:grid;place-items:center;min-width:0}
.qr-venue{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
@media (max-width:700px){.cal-d{min-height:64px}.cal-e{font-size:0;height:6px;padding:0}.mail-info{grid-template-columns:1fr}.mail-qr{flex-direction:column}.qrow{grid-template-columns:24px 1fr}.qrow select,.qrow .icon-btn{grid-column:2}}
/* IPP / IPE KPI layout */
.kgroup{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--surface-2)}
.kg-badge{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff}
.kg-badge.sh{background:var(--blue)}.kg-badge.fo{background:var(--magenta)}
.krow{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:10px}
.krow-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:12px 14px;cursor:pointer;align-items:center}
.krow-h:hover{background:var(--pink-t);border-radius:12px}
.kfig{display:flex;gap:16px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.kfig span{display:flex;flex-direction:column;align-items:flex-end}
.kfig b{font-size:14px;color:var(--ink);font-weight:700;white-space:nowrap}
.kchev{color:var(--magenta);font-size:12px}
.kbody{padding:0 14px 14px}
.ms-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mcell{border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-width:0}
.mcell .mm{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:10px}
.mcell .mt{font-size:10px;color:var(--faint)}
.mcell b{font-size:13px;min-height:18px}
.mcell input.inp{width:100%;padding:3px 4px;text-align:center;font-weight:700}
.mcell .ms-st{font-size:9.5px;color:var(--muted);min-height:12px}
.mcell.lock{background:var(--blue-t);border-color:transparent}
.mcell.pend{background:var(--yellow-t);border-color:var(--yellow)}
.mcell.open{border-color:var(--magenta);box-shadow:0 0 0 2px var(--pink-t)}
.mcell.miss{background:#F6E3EA;border-color:var(--maroon)}
.mcell.miss .ms-st{color:var(--maroon);font-weight:700}
.mcell.fut,.mcell.none{opacity:.5}
.mcell .btn.sm{padding:2px 8px;font-size:10px}
@media (max-width:900px){.krow-h{grid-template-columns:1fr}.kfig{justify-content:flex-start}.kfig span{align-items:flex-start}.ms-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* Performance Qualitative (existing layout) */
.qgroup{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.qg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);padding:12px 16px;border-bottom:1px solid var(--line)}
.qgroup>label.f{padding:0 16px 16px}
.qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:16px}
.qcard{background:var(--blue-t);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.qcard h4{font-size:13.5px;line-height:1.45;font-weight:600}
.qw{color:var(--ink)} .qn{font-style:italic;color:var(--muted);text-align:right}
.qlv{display:flex;flex-direction:column;gap:6px}
.qopt{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.4;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,.55)}
.qopt input{margin-top:2px;accent-color:var(--magenta)}
.qopt.self{border-color:var(--pink)} .qopt.mgr{border-color:var(--blue);background:#fff}
.tag{font-style:normal;font-size:10px;font-weight:700;border-radius:99px;padding:0 6px;margin-left:4px}
.tag.s{background:var(--pink-t);color:var(--magenta)} .tag.m{background:var(--blue);color:#fff}

.nb-no{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
/* goals (IPP) */
.checks{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.checks .ok{color:var(--blue)} .checks .bad{color:var(--maroon);font-weight:600}
.mt-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mt-grid label{display:flex;flex-direction:column;gap:2px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center}
.mt-grid input{text-align:center;padding:6px 4px}
@media (max-width:700px){.mt-grid{grid-template-columns:repeat(4,1fr)}}


.tp{--magenta:#ED0677; --kuning:#FFCB05; --pink:#F6AABF; --biru:#496AAA; --ink:#3B2C2F; --marun:#841945;
  --t-pink:#FDEDF3; --t-yellow:#FFF6D1; --t-blue:#E9EEF7; --t-green:#EAF6EF; --green:#2F7D55;
  --line:#F1E4E9; --muted:#7D6E72; --soft:#A99BA0; --bg2:#FCF8FA;
}
.tp button:focus-visible,.tp summary:focus-visible,.tp a:focus-visible{outline:2px solid var(--magenta);outline-offset:2px;border-radius:8px}
.tp .passport{background:#fff;border:1px solid var(--line);border-radius:32px;overflow:hidden;box-shadow:0 30px 60px -34px rgba(237,6,119,.35),0 2px 6px rgba(59,44,47,.04)}
.tp .head{position:relative;padding:22px 22px 20px;overflow:hidden}
.tp .tp-curves{position:absolute;top:0;left:0;right:0;width:100%;height:240px;pointer-events:none}
.tp .logos{position:relative;display:flex;justify-content:space-between;align-items:center}
.tp .logos .aa{height:24px}
.tp .logos .hc{height:28px}
.tp .title{position:relative;margin:24px 0 0}
.tp .title h1{margin:0;font-size:30px;font-weight:800;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase}
.tp .title h1 span{position:relative;z-index:0;white-space:nowrap}
.tp .title h1 span::before{content:"";position:absolute;left:-4px;right:-6px;bottom:3px;height:12px;background:var(--kuning);transform:skew(-12deg);z-index:-1;border-radius:2px}
.tp .title p{margin:8px 0 0;font-size:13px;font-weight:600;color:var(--magenta)}
.tp .id{position:relative;display:flex;gap:14px;align-items:center;margin-top:22px}
.tp .photo{width:78px;height:90px;border-radius:20px;background:var(--magenta);color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--kuning);flex-shrink:0}
.tp .id h2{margin:0;font-size:19px;font-weight:800;line-height:1.15}
.tp .id p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.35}
.tp .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tp .tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--t-pink);color:var(--magenta)}
.tp .tag.y{background:var(--t-yellow);color:#7a5e00}
.tp .tag.b{background:var(--t-blue);color:var(--biru)}
.tp .facts{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.tp .facts div{padding:9px 6px;text-align:center}
.tp .facts div + div{border-left:1px solid var(--line)}
.tp .facts span{display:block;font-size:10px;color:var(--soft)}
.tp .facts b{font-size:12px;font-weight:700}
.tp .nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.tp .nav ol{list-style:none;margin:0;padding:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tp .nav ol::-webkit-scrollbar{display:none}
.tp .nav a{display:flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:999px;transition:background .2s,color .2s}
.tp .nav a b{font-size:10px;width:18px;height:18px;border-radius:50%;background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.tp .nav a:hover{color:var(--magenta)}
.tp .nav a.on{background:var(--t-pink);color:var(--magenta)}
.tp .nav a.on b{background:var(--magenta);border-color:var(--magenta);color:#fff}
.tp .story{position:relative;padding:4px 20px 8px 20px}
.tp .story::before{content:"";position:absolute;left:33px;top:30px;bottom:40px;border-left:2px dashed var(--pink)}
.tp .chap{position:relative;padding:22px 0 18px 42px}
.tp .chap-h{position:relative;margin-bottom:12px}
.tp .chap-h .num{position:absolute;left:-42px;top:-1px;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--magenta);color:var(--magenta);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:1}
.tp .chap.hl .chap-h .num{background:var(--magenta);color:#fff}
.tp .chap-h small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--magenta)}
.tp .chap-h h3{margin:1px 0 0;font-size:17px;font-weight:800;line-height:1.25}
.tp .chap-h p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.tp .box{border:1px solid var(--line);border-radius:20px;padding:14px;background:#fff;transition:border-color .2s,box-shadow .2s,transform .2s}
.tp .box:hover{border-color:var(--pink);box-shadow:0 10px 24px -18px rgba(237,6,119,.5)}
.tp .box + .box{margin-top:10px}
.tp .lbl{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.tp .lbl i{font-style:normal;font-size:13px}
.tp .bar{height:7px;border-radius:999px;background:var(--t-pink);overflow:hidden}
.tp .bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--magenta);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.tp .bar.b{background:var(--t-blue)}
.tp .bar.b i{background:var(--biru)}
.tp .bar.y{background:var(--t-yellow)}
.tp .bar.y i{background:var(--kuning)}
.tp .bar.g{background:var(--t-green)}
.tp .bar.g i{background:var(--green)}
@media (prefers-reduced-motion: reduce){.tp .bar i{transition:none}}
.tp .tip{position:relative;display:inline-flex;align-items:center;gap:3px;border:0;background:transparent;padding:0;font:inherit;font-weight:800;cursor:help}
.tp .tip::after{content:"i";display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);font-size:8.5px;font-weight:700;color:var(--soft);font-style:italic}
.tp .tip .tt{position:absolute;right:-6px;bottom:calc(100% + 8px);width:220px;background:var(--ink);color:#fff;font-size:11px;font-weight:500;line-height:1.45;padding:9px 11px;border-radius:12px;text-align:left;opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .15s,transform .15s;z-index:30;box-shadow:0 12px 24px -12px rgba(0,0,0,.5)}
.tp .tip .tt::after{content:"";position:absolute;right:12px;top:100%;border:6px solid transparent;border-top-color:var(--ink)}
.tp .tip:hover .tt,.tp .tip:focus .tt,.tp .tip:focus-within .tt{opacity:1;transform:none}
.tp details.why{margin-top:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.tp details.why summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-size:12px;font-weight:700;color:var(--magenta);cursor:pointer}
.tp details.why summary::-webkit-details-marker{display:none}
.tp details.why summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--magenta);border-bottom:2px solid var(--magenta);transform:rotate(45deg);transition:transform .2s;margin-top:-4px}
.tp details.why[open] summary::after{transform:rotate(-135deg);margin-top:2px}
.tp details.why .in{padding:0 12px 12px;font-size:12px;color:var(--ink)}
.tp details.why .in p{margin:0 0 8px}
.tp .road{position:relative;display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px}
.tp .road::before{content:"";position:absolute;left:16%;right:16%;top:18px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--pink),var(--magenta))}
.tp .step{position:relative;text-align:center}
.tp .dot{width:36px;height:36px;margin:0 auto;border-radius:50%;background:#fff;border:3px solid var(--pink);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--marun)}
.tp .step.now .dot{background:var(--magenta);border-color:var(--magenta);color:#fff;box-shadow:0 0 0 4px var(--t-pink)}
.tp .step b{display:block;font-size:11.5px;font-weight:700;margin-top:8px;line-height:1.25}
.tp .step span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.tp .step em{font-style:normal;display:inline-block;margin-top:4px;font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--t-blue);color:var(--biru)}
.tp .step.now em{background:var(--kuning);color:var(--ink)}
.tp .journey-note{margin:12px 0 0;font-size:12px;color:var(--muted)}
.tp .journey-note b{color:var(--ink)}
.tp .hero-card{position:relative;border-radius:24px;background:var(--t-pink);padding:18px 118px 18px 16px;overflow:hidden;min-height:210px}
.tp .hero-card::before{content:"";position:absolute;right:-50px;bottom:-70px;width:220px;height:220px;border-radius:50%;background:var(--kuning)}
.tp .hero-card img{position:absolute;right:2px;bottom:0;max-height:200px;max-width:140px;height:auto;width:auto}
.tp .hero-card .badge{position:relative;display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:3px 10px;font-size:10.5px;font-weight:700;color:var(--magenta)}
.tp .hero-card h4{position:relative;margin:10px 0 6px;font-size:23px;font-weight:800;line-height:1.1;color:var(--magenta)}
.tp .hero-card h4 span{display:block;font-size:26px;margin-bottom:2px}
.tp .hero-card p{position:relative;margin:0;font-size:12.5px;line-height:1.45}
.tp .evidence{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tp .ev{border:1px solid var(--line);border-radius:16px;padding:10px 12px;background:#fff}
.tp .ev span{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
.tp .ev b{display:block;font-size:19px;font-weight:800;line-height:1.2;margin:2px 0 6px}
.tp .ev b small{font-size:11px;font-weight:600;color:var(--soft)}
.tp .ev.up b{color:var(--green)}
.tp .engine{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tp .engine span{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.tp .engine span.hit{background:var(--magenta);border-color:var(--magenta);color:#fff}
.tp .kpi{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.tp .ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--magenta) calc(var(--p)*1%),var(--t-pink) 0);display:flex;align-items:center;justify-content:center;transition:--p 1s}
.tp .ring div{width:66px;height:66px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tp .ring b{font-size:21px;font-weight:800;line-height:1;color:var(--magenta)}
.tp .ring span{font-size:9px;color:var(--muted)}
.tp .kpi ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.tp .kpi li{display:flex;gap:8px;font-size:12px;line-height:1.35}
.tp .kpi li::before{content:"✓";flex-shrink:0;width:17px;height:17px;border-radius:50%;background:var(--t-pink);color:var(--magenta);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.tp .goals{display:flex;gap:4px;margin-top:12px}
.tp .goals i{flex:1;height:8px;border-radius:4px;background:var(--magenta)}
.tp .goals i.off{background:var(--t-pink)}
.tp .goals-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}
.tp .row{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.tp .row span{font-size:12px;font-weight:600}
.tp .row .v{font-size:13px;min-width:34px;text-align:right}
.tp .grow-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.tp .grow-item + .grow-item{border-top:1px dashed var(--line)}
.tp .grow-item .ico{width:30px;height:30px;border-radius:10px;background:var(--t-green);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.tp .grow-item b{display:block;font-size:12.5px}
.tp .grow-item p{margin:2px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4}
.tp .fine{margin:10px 0 0;font-size:10.5px;color:var(--soft);line-height:1.45}
.tp .legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tp .legend span{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.tp .cat-s{background:var(--t-yellow);color:#7a5e00}
.tp .cat-o{background:var(--t-blue);color:var(--biru)}
.tp .cat-g{background:var(--t-green);color:var(--green)}
.tp .val{padding:10px 0;border-top:1px solid var(--line)}
.tp .val:first-child{border-top:0;padding-top:2px}
.tp .val-h{display:flex;align-items:center;gap:8px}
.tp .val-h .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex-shrink:0}
.tp .val-h strong{font-size:13px;font-weight:700}
.tp .val-h .cat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tp .val-h .tip{margin-left:auto;font-size:14px}
.tp .val .bar{margin-top:7px;height:6px}
.tp .val .bar i{background:var(--c)}
.tp .val p{margin:6px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4}
.tp .val.growth{background:var(--t-green);border-radius:16px;padding:12px;border:0;margin:6px 0}
.tp .val.growth + .val{border-top:0}
.tp .target{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;flex-wrap:wrap}
.tp .target b{font-weight:800}
.tp .target .arr{color:var(--green);font-weight:800}
.tp .target .rec{background:#fff;border-radius:999px;padding:2px 9px;font-weight:600;color:var(--green)}
.tp .hours{display:flex;align-items:flex-end;gap:10px;margin-bottom:8px}
.tp .hours b{font-size:30px;font-weight:800;line-height:1}
.tp .hours span{font-size:12px;color:var(--muted);padding-bottom:3px}
.tp .chain{border:1px solid var(--line);border-radius:18px;padding:12px;background:#fff}
.tp .chain + .chain{margin-top:8px}
.tp .chain-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tp .chain-top b{font-size:12.5px;line-height:1.3}
.tp .chain-top span{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--t-blue);color:var(--biru);white-space:nowrap}
.tp .flow{display:grid;grid-template-columns:minmax(0,auto) auto minmax(0,1fr);align-items:center;gap:6px;margin-top:9px}
.tp .flow div{font-size:11px;line-height:1.3;padding:6px 9px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.tp .flow div small{display:block;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--soft)}
.tp .flow div.app{background:var(--t-yellow);border-color:transparent}
.tp .flow i{font-style:normal;color:var(--magenta);font-weight:800}
.tp .cert{position:relative;display:flex;gap:12px;align-items:center;border-radius:18px;padding:14px;background:linear-gradient(135deg,#fff 0%,var(--t-yellow) 100%);border:1px solid #F7E4A0;overflow:hidden;margin-top:10px}
.tp .cert .seal{width:46px;height:46px;border-radius:50%;background:var(--kuning);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 4px #fff,0 0 0 5px #F7E4A0}
.tp .cert .seal svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tp .cert b{display:block;font-size:13px;line-height:1.3}
.tp .cert span{font-size:11px;color:var(--muted)}
.tp .cert em{font-style:normal;display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff;color:var(--marun)}
.tp .idp{margin-top:10px}
.tp .idp-row{padding:8px 0}
.tp .idp-row + .idp-row{border-top:1px dashed var(--line)}
.tp .idp-row .t{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:6px}
.tp .idp-row .t b{font-weight:600;line-height:1.35}
.tp .idp-row .t span{font-weight:800;color:var(--magenta)}
.tp .idp-row small{font-size:10.5px;color:var(--soft)}
.tp .rhythm{border-radius:22px;background:var(--magenta);color:#fff;padding:16px;position:relative;overflow:hidden}
.tp .rhythm svg.jc{position:absolute;right:-20px;top:-10px;width:170px;height:120px;pointer-events:none}
.tp .rhythm small{position:relative;font-size:11px;opacity:.85}
.tp .rhythm h4{position:relative;margin:2px 0 12px;font-size:19px;font-weight:800}
.tp .rhythm .g{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tp .rhythm .g div{background:rgba(255,255,255,.15);border-radius:14px;padding:10px 12px}
.tp .rhythm .g b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.tp .rhythm .g span{font-size:11px;opacity:.9}
.tp .rhythm-note{display:flex;gap:8px;margin-top:10px;font-size:11.5px;color:var(--muted);line-height:1.45}
.tp .rhythm-note i{font-style:normal}
.tp .kge{display:grid;grid-template-columns:1fr;gap:8px}
.tp .k{border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1px solid transparent}
.tp .k .ic{width:36px;height:36px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.tp .k small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em}
.tp .k b{display:block;font-size:14px;line-height:1.3;margin-top:1px}
.tp .k p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4}
.tp .k.keep{background:var(--t-yellow)}
.tp .k.keep small{color:#7a5e00}
.tp .k.grow{background:var(--t-green)}
.tp .k.grow small{color:var(--green)}
.tp .k.explore{background:var(--t-blue)}
.tp .k.explore small{color:var(--biru)}
.tp .recs{margin-top:12px;border:1.5px dashed var(--pink);border-radius:18px;padding:12px 14px}
.tp .rec{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.tp .rec span.ic{width:26px;height:26px;border-radius:9px;background:var(--t-pink);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tp .rec small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--soft)}
.tp .rec b{font-size:12.5px;line-height:1.35}
.tp .cta{display:flex;gap:8px;margin-top:12px}
.tp .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 12px;border-radius:14px;font-size:12.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink);transition:border-color .2s,color .2s,background .2s,transform .15s}
.tp .btn:hover{border-color:var(--magenta);color:var(--magenta)}
.tp .btn:active{transform:scale(.98)}
.tp .btn.p{background:var(--magenta);border-color:var(--magenta);color:#fff}
.tp .btn.p:hover{background:#d10569;color:#fff}
.tp .btn[disabled]{opacity:.6;cursor:wait}
.tp .btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tp .promise{margin:10px 0 0;font-size:10.5px;color:var(--soft);line-height:1.45}
.tp .eco{margin:4px 20px 0;padding:14px;border-radius:20px;background:var(--bg2);border:1px solid var(--line)}
.tp .eco small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.tp .eco .f{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10.5px;font-weight:600}
.tp .eco .f span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.tp .eco .f span.me{background:var(--magenta);border-color:var(--magenta);color:#fff}
.tp .eco .f i{font-style:normal;color:var(--pink)}
.tp .eco p{margin:8px 0 0;font-size:10.5px;color:var(--soft);line-height:1.45}
.tp .verify{margin:10px 20px 0;padding:10px 14px;border-radius:16px;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.tp .verify span{display:block;font-size:10px;color:var(--soft)}
.tp .verify b{font-family:'Courier New',ui-monospace,monospace;font-size:11px;letter-spacing:.05em}
.tp .barcode{display:flex;gap:2px;height:24px;align-items:stretch}
.tp .barcode i{background:var(--ink);border-radius:1px}
.tp .foot{display:flex;justify-content:space-between;padding:12px 20px 18px;font-size:10.5px;color:var(--soft)}
@media (max-width:380px){.tp .head{padding-left:16px;padding-right:16px}
.tp .story{padding-left:12px;padding-right:12px}
.tp .story::before{left:25px}
.tp .title h1{font-size:26px}
.tp .hero-card{padding-right:96px}
.tp .hero-card img{max-width:110px;max-height:170px}
.tp .row{grid-template-columns:80px 1fr auto}
.tp .evidence{grid-template-columns:1fr 1fr}}
/* ---------- tambahan aplikasi ---------- */
.clickable{cursor:pointer}
button.tile{font:inherit;text-align:left;cursor:pointer;color:inherit}
button.tile:hover{border-color:var(--magenta)}
.card.stat.clickable:hover{border-color:var(--magenta)}
.divider{height:1px;background:var(--line);margin:16px 0}
.note.warn{background:#F6E3EA}.note.warn svg{color:var(--maroon)}
.side-foot .btn.link{padding:6px 0 0;font-size:12px}
.side .nav-group:first-of-type{padding-top:0}
.hero .hero-in p{opacity:.92}
/* rincian hitung */
.calc{margin-top:12px;background:var(--yellow-t);border-radius:12px;padding:12px 14px;font-size:12.5px}
.calc b{display:flex;align-items:center;gap:6px;font-size:12px}
.calc b svg{width:16px;height:16px;color:var(--magenta)}
.calc ol{margin:8px 0 6px;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
/* nine-box */
.nb-wrap{display:grid;grid-template-columns:22px 1fr;gap:6px}
.nb-y{display:flex;align-items:center;justify-content:center}
.nb-y span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:600;color:var(--muted)}
.nb{display:grid;gap:8px}
.nb-lbl{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg)}
.nb-lbl.x{writing-mode:horizontal-tb;transform:none;padding-top:2px}
.nb-x{text-align:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:6px}
.nb-cell{border-radius:12px;padding:10px;min-height:118px;display:flex;flex-direction:column;gap:6px;cursor:pointer;border:2px solid transparent;font-size:12.5px}
.nb-cell:hover{border-color:var(--pink)}
.nb-cell.on{border-color:var(--magenta);box-shadow:0 0 0 3px var(--pink-t)}
.nb-cell small{color:var(--muted);font-size:11px;line-height:1.35;margin-top:auto}
.nb-count{background:#fff;border-radius:99px;font-weight:700;font-size:11px;padding:0 8px;min-width:24px;text-align:center}
.nb-people{display:flex;flex-wrap:wrap;gap:4px}
.nb-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:700;cursor:pointer;box-shadow:0 0 0 2px #fff}
.nb-av:hover{transform:scale(1.08)}
/* funnel */
.funnel{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;align-items:end}
.fn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 10px 12px;height:128px;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;cursor:pointer;overflow:hidden;text-align:left;font:inherit;color:inherit}
.fn span{font-size:11.5px;color:var(--muted);font-weight:600;position:relative;z-index:1;line-height:1.25}
.fn b{font-size:24px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.fn i{position:absolute;left:0;right:0;bottom:0;background:var(--pink-t)}
.fn:hover{border-color:var(--magenta)}
.fn.on{border-color:var(--magenta);box-shadow:0 0 0 3px var(--pink-t)}
.fn.on i{background:var(--pink)}
@media (max-width:900px){.funnel{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* modal pilihan */
.pick{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.pick:hover{border-color:var(--magenta);background:var(--pink-t)}
.flowg .flow-i{align-items:flex-start}
/* IDP */
.idp-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.idp-card .row input[type=range]{flex:1}
/* passport gallery */
.pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pp-card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);cursor:pointer;font:inherit;color:inherit;text-align:left}
.pp-card:hover{border-color:var(--magenta);box-shadow:0 8px 22px -16px rgba(237,6,119,.6)}
.pp-card b{display:block;font-weight:600;line-height:1.3}
.pp-card small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-card.off{background:var(--surface-2)}
.pp-char{position:relative;height:118px;border-radius:14px;background:var(--pink-t);overflow:hidden;display:flex;align-items:flex-end;padding:10px}
.pp-char::before{content:"";position:absolute;right:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:var(--yellow)}
.pp-char img{position:absolute;right:4px;bottom:0;height:112px}
.pp-char span{position:relative;font-weight:800;color:var(--magenta);font-size:14px;max-width:60%;line-height:1.2}
.pp-char.empty{background:var(--surface-2);align-items:center;justify-content:center}
.pp-char.empty::before{display:none}
.pp-char.empty span{color:var(--muted);font-weight:600;font-size:12px;max-width:none;text-align:center}
.pp-layout{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:20px;align-items:start}
.pp-layout>.tp{max-width:460px;width:100%;margin:0 auto}
.pp-side{position:sticky;top:0}
.pp-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pp-actions .chip{margin-right:auto}
.tp .logos{padding:0}
.tp .nav{top:-26px}
.tp .nav a{cursor:pointer}
@media (max-width:1000px){.pp-layout{grid-template-columns:1fr}.pp-side{position:static}}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff;height:auto}
  .side,.top,.no-print,.pp-side,[data-noshot],.toast,.scrim,.btn{display:none!important}
  .app{display:block;height:auto}.main{height:auto;display:block}.content{overflow:visible;padding:0}
  .pp-layout{display:block}.pp-layout>.tp{margin:0 auto}
  .tp .passport{box-shadow:none}.tp details.why{display:none}
  .card{box-shadow:none}
}
@media (max-width:700px){
  .top{flex-wrap:wrap;row-gap:8px}
  .top-right{flex-wrap:wrap;gap:8px;margin-left:0;width:100%}
  .top-right .persona{max-width:none;flex:1 1 160px}
  .top-right .icon-btn{display:none}
}

</style>

  fillActuals(sharing.company, .03, 'sh-co'); fillActuals(sharing.HCIS, .01, 'sh-hcis'); fillActuals(sharing['Human Capital'], -.01, 'sh-hc');
  /* tahunan AVG Input: isi tiap bulan */
  for (let i = 0; i < 12; i++) { sharing.HCIS.actuals[i] = [94, 95.5, 96, 95, 97, 96.5, 95, 96, 97, 96, 95.5, 96][i]; sharing.HCIS.mstat[i] = 'Approved'; }

/* =====================================================================
   ENGINE PERHITUNGAN — semua angka di aplikasi berasal dari sini
   ===================================================================== */
let DB = null;
const CFG = () => DB.cfg;
const empOf = id => DB.emps.find(e => e.id === id);
const mgrById = id => DB.managers.find(m => m.id === id);
const teamOfMgr = mid => DB.emps.filter(e => e.mgr === mid);
const DEPTS = () => [...new Set([...DB.managers.map(m => m.dept), ...DB.emps.map(e => e.dept)])];

/* Sharing KPI: dipakai bersama — perusahaan + departemen */
function sharingFor(e) {
  const list = [];
  if (DB.sharing.company) list.push({ key: 'company', k: DB.sharing.company });
  if (DB.sharing[e.dept]) list.push({ key: e.dept, k: DB.sharing[e.dept] });
  return list;
}
const sharingWeight = e => sharingFor(e).reduce((a, s) => a + (+s.k.w || 0), 0);
const ippWeight = e => sharingWeight(e) + e.ipp.goals.reduce((a, g) => a + (+g.w || 0), 0);

/* ---------- KPI: YTD, achievement, score (rumus IPP/IPE existing) ---------- */
function kpiCalc(k) {
  const cut = CFG().cutoff, months = [...Array(cut + 1).keys()];
  const monthly = k.period === 'Monthly';
  const rep = monthly ? months.filter(i => isNum(k.targets[i])) : months;
  const filled = rep.filter(i => isNum(k.actuals[i]));
  const missing = rep.filter(i => !isNum(k.actuals[i]));
  const A = i => isNum(k.actuals[i]) ? +k.actuals[i] : 0, T = i => monthly ? +k.targets[i] : 0;
  const sum = (ix, f) => ix.reduce((s, i) => s + f(i), 0);
  let a = 0, t = 0, aTxt = '', tTxt = '';
  const list = (ix, f) => ix.map(i => shortNum(k, f(i))).join(' + ');
  if (!filled.length) return { a: null, t: null, ach: null, score: null, filled: 0, rep: rep.length, missing, steps: ['Belum ada realisasi yang diisi.'] };
  if (k.formula === 'SUM') {
    a = sum(rep, A); t = monthly ? sum(rep, T) : +k.target;
    aTxt = `Realisasi YTD = ${list(rep, A)} = ${fmtVal(k, a)}`; tTxt = monthly ? `Target YTD = Σ target ${rep.length} bulan = ${fmtVal(k, t)}` : `Target tahunan = ${fmtVal(k, t)}`;
  } else if (k.formula === 'AVG') {
    a = rep.length ? sum(rep, A) / rep.length : 0; t = monthly ? sum(rep, T) / rep.length : +k.target;
    aTxt = `Realisasi = (${list(rep, A)}) ÷ ${rep.length} bulan = ${fmtVal(k, a)}`; tTxt = monthly ? `Target = rata-rata target ${rep.length} bulan = ${fmtVal(k, t)}` : `Target tahunan = ${fmtVal(k, t)}`;
  } else if (k.formula === 'AVG Input') {
    a = sum(filled, A) / filled.length; t = monthly ? sum(filled, T) / filled.length : +k.target;
    aTxt = `Realisasi = (${list(filled, A)}) ÷ ${filled.length} bulan terisi = ${fmtVal(k, a)}`; tTxt = monthly ? `Target = rata-rata target ${filled.length} bulan terisi = ${fmtVal(k, t)}` : `Target tahunan = ${fmtVal(k, t)}`;
  } else {
    const li = filled[filled.length - 1]; a = A(li); t = monthly ? T(li) : +k.target;
    aTxt = `Realisasi = nilai bulan terakhir terisi (${MONTHS[li]}) = ${fmtVal(k, a)}`; tTxt = monthly ? `Target ${MONTHS[li]} = ${fmtVal(k, t)}` : `Target tahunan = ${fmtVal(k, t)}`;
  }
  let ach = 0, achTxt;
  if (!t) { ach = 0; achTxt = 'Target 0 → pencapaian tidak bisa dihitung (0%)'; }
  else if (/HIB/.test(k.cat)) { ach = ((t - a) / t + 1) * 100; achTxt = `HIB: ((${shortNum(k, t)} − ${shortNum(k, a)}) ÷ ${shortNum(k, t)} + 1) × 100% = ${fmt(ach)}%`; }
  else { ach = a / t * 100; achTxt = `HIG: ${shortNum(k, a)} ÷ ${shortNum(k, t)} × 100% = ${fmt(ach)}%`; }
  if (/100$/.test(k.cat) && ach > 100) { achTxt += ` → dibatasi 100%`; ach = 100; }
  if (ach < 0) { achTxt += ' → minimal 0%'; ach = 0; }
  const band = CFG().kpiBands.find(b => ach >= b.min), score = band.score;
  const steps = [aTxt, tTxt, achTxt, `Skor KPI = ${fmt(score, 1)} (pencapaian ${band.min > -1e8 ? '≥ ' + band.min + '%' : '< ' + CFG().kpiBands[CFG().kpiBands.length - 2].min + '%'})`];
  return { a, t, ach, score, filled: filled.length, rep: rep.length, missing, steps };
}
const kpiScoreOf = ach => CFG().kpiBands.find(b => ach >= b.min).score;
const bandOf = s => s == null ? null : CFG().ratingBands.find(b => s >= b.min) || CFG().ratingBands[CFG().ratingBands.length - 1];

/* Semua KPI karyawan (sharing + focus) beserta hasil hitung */
function allKpis(e) {
  return [...sharingFor(e).map(s => ({ ...s.k, type: 'Sharing', shareKey: s.key })), ...e.ipp.goals.map(g => ({ ...g, type: 'Focus' }))]
    .map(k => ({ ...k, c: kpiCalc(k) }));
}
function kpiTotal(e) {
  const ks = allKpis(e), tw = ks.reduce((a, k) => a + (+k.w || 0), 0);
  if (e.ipp.status !== 'Approved' || !ks.some(k => k.c.ach != null) || !tw) return { ks, score: null, ipe: null, tw, noData: ks.filter(k => k.c.ach == null).length };
  const sc = k => k.c.score == null ? CFG().kpiBands[CFG().kpiBands.length - 1].score : k.c.score;
  const score = ks.reduce((a, k) => a + sc(k) * k.w, 0) / tw;
  const ipe = ks.reduce((a, k) => a + (k.c.ach || 0) * k.w, 0) / tw;
  return { ks, score, ipe, tw, noData: ks.filter(k => k.c.ach == null).length };
}

/* ---------- Kualitatif ---------- */
function groupScore(ratings, key) {
  const it = BEHAVIORS.filter(b => b.g === key && isNum(ratings[b.id])), tw = it.reduce((a, b) => a + b.w, 0);
  return tw ? it.reduce((a, b) => a + b.w * ratings[b.id], 0) / tw : null;
}
function compScore(ratings) {
  if (!BEHAVIORS.every(b => isNum(ratings[b.id]))) return null;
  const tw = QUAL_GROUPS.reduce((a, g) => a + g.w, 0);
  return QUAL_GROUPS.reduce((a, g) => a + g.w * groupScore(ratings, g.key), 0) / tw;
}
function f360Of(e) {
  const resp = e.f360 || [];
  if (!resp.length) return { avg: null, n: 0, items: F360_ITEMS.map(i => ({ ...i, v: null })) };
  const ravg = r => { const v = F360_ITEMS.map(i => r.r[i.id]).filter(isNum); return v.reduce((a, b) => a + b, 0) / v.length; };
  const avg = resp.reduce((a, r) => a + ravg(r), 0) / resp.length;
  const items = F360_ITEMS.map(i => { const v = resp.map(r => r.r[i.id]).filter(isNum); return { ...i, v: v.length ? v.reduce((a, b) => a + b, 0) / v.length : null }; });
  return { avg, n: resp.length, items };
}
/* Penilai 360: 2 rekan satu tim (berikutnya di urutan) + 1 lintas fungsi */
function assessorsOf(e) {
  const team = teamOfMgr(e.mgr), idx = team.indexOf(e), out = [];
  for (let j = 1; j < team.length && out.length < 2; j++) out.push({ id: team[(idx + j) % team.length].id, rel: 'Peer' });
  const others = DB.managers.filter(m => m.id !== e.mgr).flatMap(m => teamOfMgr(m.id));
  if (others.length) out.push({ id: others[idx % others.length].id, rel: 'Lintas fungsi' });
  return out;
}

/* ---------- Skor akhir ---------- */
function liveScores(e) {
  const kt = kpiTotal(e), comp = e.pa.mgrSubmitted || Object.keys(e.pa.mgr).length ? compScore(e.pa.mgr) : null;
  const f = f360Of(e), c = CFG();
  const use360 = c.use360 && f.avg != null;
  const qual = comp == null ? null : use360 ? (comp * c.qualMix.comp + f.avg * c.qualMix.f360) / (c.qualMix.comp + c.qualMix.f360) : comp;
  const overall = kt.score == null || qual == null ? null : (kt.score * c.weights.kpi + qual * c.weights.qual) / (c.weights.kpi + c.weights.qual);
  return { kpi: kt.score, ipe: kt.ipe, comp, f360: f.avg, f360n: f.n, use360, qual, overall, kt };
}
/* Setelah kalibrasi disetujui, angka dibekukan (snapshot) */
function scoresOf(e) {
  if (e.calib.status === 'Disetujui' && e.calib.snap) { const s = e.calib.snap; return { ...s, final: s.final, frozen: true, kt: kpiTotal(e) }; }
  const s = liveScores(e);
  const final = s.overall == null ? null : e.calib.adj != null ? e.calib.adj : s.overall;
  return { ...s, final, frozen: false };
}
function snapshot(e) {
  const s = liveScores(e);
  e.calib.snap = { kpi: s.kpi, ipe: s.ipe, comp: s.comp, f360: s.f360, f360n: s.f360n, use360: s.use360, qual: s.qual, overall: s.overall, final: e.calib.adj != null ? e.calib.adj : s.overall, at: nowStr() };
}
/* Kekuatan & kebutuhan development */
function strengthsDev(e) {
  const items = [...BEHAVIORS.filter(b => isNum(e.pa.mgr[b.id])).map(b => ({ name: b.name, v: +e.pa.mgr[b.id], src: 'Kompetensi' })), ...f360Of(e).items.filter(i => i.v != null).map(i => ({ name: i.name, v: i.v, src: '360' }))];
  const strengths = [...items].sort((a, b) => b.v - a.v).slice(0, 3);
  const dev = items.filter(a => a.v < CFG().devThreshold).sort((a, b) => a.v - b.v).slice(0, 3).map(a => ({ ...a, target: CFG().devTarget, gap: +(CFG().devTarget - a.v).toFixed(2) }));
  return { strengths, dev };
}

/* ---------- IPP checks ---------- */
function ippChecks(e) {
  const g = e.ipp.goals, tw = ippWeight(e), names = g.map(x => x.name.trim().toLowerCase()), c = CFG();
  const tOk = x => x.period === 'Yearly' ? isNum(x.target) && +x.target > 0 : (x.targets || []).some(isNum) && x.targets.filter(isNum).every(v => +v > 0);
  return [
    { ok: Math.abs(tw - 100) < .001, msg: `Total bobot ${fmt(tw, 0)}% (harus 100%, termasuk Sharing KPI ${sharingWeight(e)}%)` },
    { ok: g.length >= c.ippMin && g.length <= c.ippMax, msg: `${g.length} Focus KPI (${c.ippMin}–${c.ippMax} diperbolehkan)` },
    { ok: g.length > 0 && g.every(x => +x.w >= c.ippMinW), msg: `Bobot tiap KPI minimal ${c.ippMinW}%` },
    { ok: g.length > 0 && g.every(tOk), msg: 'Semua target terisi dan lebih dari 0' },
    { ok: new Set(names).size === names.length, msg: 'Tidak ada nama KPI ganda' },
    { ok: g.filter(x => x.tpl === 'project').every(x => x.formula === 'Last'), msg: 'KPI proyek memakai formula Last' }];
}

/* ---------- Tahapan alur per karyawan ---------- */
const STAGES = [['ipp', 'Goal (IPP)'], ['ipe', 'Realisasi (IPE)'], ['self', 'Self assessment'], ['mgr', 'Review atasan'], ['calib', 'Kalibrasi'], ['result', 'Hasil final'], ['talent', 'Talent & Passport']];
function ipeStatus(e) {
  const cut = CFG().cutoff, M = [...Array(cut + 1).keys()]; let need = 0, appr = 0, sub = 0, empty = 0, ret = 0, draft = 0;
  e.ipp.goals.forEach(k => {
    const req = k.period === 'Monthly' ? M.filter(i => isNum(k.targets[i])) : M.filter(i => isNum(k.actuals[i]) || k.mstat[i]);
    if (k.period === 'Yearly' && !req.length) { need++; empty++; return; }
    req.forEach(i => { need++; const s = k.mstat[i]; if (s === 'Approved') appr++; else if (s === 'Submitted') sub++; else if (s === 'Returned') ret++; else if (isNum(k.actuals[i])) draft++; else empty++; });
  });
  return { need, appr, sub, empty, ret, draft, done: need > 0 && appr === need };
}
function stageFlags(e) {
  const ipp = e.ipp.status === 'Approved', ipe = ipp && ipeStatus(e).done;
  const self = e.pa.selfSubmitted, mgr = e.pa.mgrSubmitted, calib = e.calib.status === 'Disetujui';
  const result = calib && e.released && e.confirmed, talent = calib && !!e.pot;
  return { ipp, ipe, self, mgr, calib, result, talent };
}
function stageOf(e) {
  const f = stageFlags(e), k = STAGES.find(([key]) => !f[key]);
  return k ? k : ['done', 'Selesai'];
}
const stageIdx = e => { const s = stageOf(e)[0]; return s === 'done' ? STAGES.length : STAGES.findIndex(x => x[0] === s); };

/* ---------- Talent ---------- */
const potOf = e => e.pot ? POT_CRIT.reduce((a, [k]) => a + (+e.pot[k] || 0), 0) / POT_CRIT.length : null;
const lvl = (v, hi, mid) => v >= hi ? 2 : v >= mid ? 1 : 0;
const NINE = [
  [{ n: 'Talent risk', a: 'Rencana perbaikan, tinjau kecocokan peran', c: '#F6E3EA' }, { n: 'Effective contributor', a: 'Jaga engagement, development terarah', c: '#F4F0F2' }, { n: 'Trusted professional', a: 'Akui keahlian, knowledge sharing', c: '#E9EEF7' }],
  [{ n: 'Inconsistent player', a: 'Perjelas ekspektasi, coaching dekat', c: '#F6E3EA' }, { n: 'Core player', a: 'Kembangkan di peran saat ini', c: '#F4F0F2' }, { n: 'High performer', a: 'Perluas pengalaman, siapkan peran berikutnya', c: '#E9EEF7' }],
  [{ n: 'Rough diamond', a: 'Diagnosa kecocokan, coaching kinerja', c: '#FFF6D1' }, { n: 'High potential', a: 'Stretch goal, mentoring', c: '#FFF6D1' }, { n: 'Star', a: 'Succession pool, akselerasi, retensi', c: '#FDEDF3' }]];
const HAV = [[{ n: 'Deadwood', a: 'Rencana perbaikan atau ganti peran', c: '#F6E3EA' }, { n: 'Workhorse', a: 'Hargai kontribusi, jaga motivasi', c: '#E9EEF7' }], [{ n: 'Problem employee', a: 'Cari hambatan kinerja, coaching', c: '#FFF6D1' }, { n: 'Star', a: 'Suksesi, retensi, stretch role', c: '#FDEDF3' }]];
function talentOf(e) {
  const s = scoresOf(e), perf = s.final, pot = potOf(e), T = CFG().talent;
  if (perf == null || pot == null) return { perf, pot, nine: null, hav: null, provisional: !s.frozen };
  return { perf, pot, provisional: !s.frozen, nine: NINE[lvl(pot, T.potHigh, T.potMid)][lvl(perf, T.perfHigh, T.perfMid)], hav: HAV[pot >= T.havPot ? 1 : 0][perf >= T.havPerf ? 1 : 0] };
}

/* ---------- Reward ---------- */
const compaIdx = cr => cr < .9 ? 0 : cr <= 1.1 ? 1 : 2;
const COMPA_LBL = ['Di bawah range (<0,90)', 'Dalam range (0,90–1,10)', 'Di atas range (>1,10)'];
function rewardOf(e) {
  const s = scoresOf(e); if (s.final == null) return null;
  const band = bandOf(s.final), cr = e.mid ? e.salary / e.mid : 1, guide = CFG().merit[band.key][compaIdx(cr)];
  const pct = e.reward.pct != null ? e.reward.pct : guide;
  const months = e.grade >= 9 ? 2 : e.grade === 8 ? 1.5 : 1;
  const mult = CFG().bonusMult[band.key], bonus = e.salary * months * CFG().companyAch / 100 * mult;
  return { band, cr, guide, pct, newSal: e.salary * (1 + pct / 100), months, mult, bonus };
}

/* ---------- Tugas (dihitung dari status data) ---------- */
function tasksFor(role, pid) {
  const T = [], add = (task, sub, act, v, tab, type) => T.push({ task, sub, act, v, tab, type });
  if (role === 'employee') {
    const e = empOf(pid); if (!e) return T;
    if (['Draft', 'Returned'].includes(e.ipp.status)) add(e.ipp.status === 'Returned' ? 'Revisi KPI (IPP) yang dikembalikan' : 'Buat KPI tahunan (IPP)', 'Bobot total 100%, lalu kirim ke atasan', 'openEmp', e.id, 'ipp', 'Goal');
    if (e.ipp.status === 'Approved') {
      const st = ipeStatus(e);
      if (st.empty + st.draft + st.ret) add('Isi & kirim realisasi KPI bulanan', `${st.empty} kosong · ${st.draft} belum dikirim${st.ret ? ` · ${st.ret} dikembalikan` : ''}`, 'openEmp', e.id, 'ipe', 'Realisasi');
      if (!e.pa.selfSubmitted) add('Isi self assessment', `${BEHAVIORS.filter(b => isNum(e.pa.self[b.id])).length} dari ${BEHAVIORS.length} perilaku sudah dinilai`, 'openEmp', e.id, 'pa', 'Penilaian');
    }
    DB.emps.filter(x => x.id !== e.id && x.ipp.status === 'Approved' && assessorsOf(x).some(a => a.id === e.id) && !x.f360.some(r => r.from === e.id))
      .forEach(x => add(`Beri feedback 360 untuk ${x.name}`, `${x.title} · sebagai ${assessorsOf(x).find(a => a.id === e.id).rel}`, 'give360', x.id, '', 'Feedback'));
    if (e.released && !e.confirmed) add('Konfirmasi hasil kinerja', 'Hasil final sudah dirilis HC', 'openEmp', e.id, 'pa', 'Hasil');
    e.idp.filter(d => d.progress < 100).forEach(d => add(`Update progres IDP: ${d.need}`, `${d.action} · ${d.progress}%`, 'openEmp', e.id, 'idp', 'Development'));
  } else if (role === 'manager') {
    teamOfMgr(pid).forEach(e => {
      if (e.ipp.status === 'Waiting manager') add(`Validasi IPP: ${e.name}`, `${e.ipp.goals.length} Focus KPI · bobot ${fmt(ippWeight(e), 0)}%`, 'openEmp', e.id, 'ipp', 'Goal');
      const sub = e.ipp.goals.reduce((a, k) => a + k.mstat.filter(s => s === 'Submitted').length, 0);
      if (sub) add(`Approve realisasi: ${e.name}`, `${sub} sel bulan menunggu approval`, 'openEmp', e.id, 'ipe', 'Realisasi');
      if (e.pa.selfSubmitted && !e.pa.mgrSubmitted) add(`Nilai kinerja: ${e.name}`, 'Self assessment sudah dikirim', 'openEmp', e.id, 'pa', 'Penilaian');
      if (e.pa.mgrSubmitted && !e.pot) add(`Isi asesmen potensi: ${e.name}`, 'Untuk penempatan 9-box & talent pool', 'potential', e.id, '', 'Talent');
      if (e.pa.mgrSubmitted && strengthsDev(e).dev.length && !e.idp.length) add(`Buat IDP: ${e.name}`, `${strengthsDev(e).dev.length} kebutuhan development terdeteksi`, 'openEmp', e.id, 'idp', 'Development');
      if (e.calib.status === 'Disetujui' && e.reward.status === 'Draft') add(`Usulkan merit & bonus: ${e.name}`, 'Rating sudah final', 'nav', 'reward', '', 'Reward');
    });
  } else {
    DB.emps.forEach(e => {
      if (e.ipp.status === 'Waiting HC') add(`Validasi IPP (HC): ${e.name}`, `Sudah divalidasi atasan · ${e.dept}`, 'openEmp', e.id, 'ipp', 'Goal');
      if (e.pa.mgrSubmitted && e.calib.status !== 'Disetujui') add(`Kalibrasi: ${e.name}`, e.calib.status === 'Diusulkan' ? 'Ada usulan penyesuaian dari atasan' : 'Siap dikalibrasi', 'nav', 'calib', '', 'Kalibrasi');
      if (e.calib.status === 'Disetujui' && !e.released) add(`Rilis hasil ke ${e.name}`, 'Kalibrasi sudah disetujui', 'nav', 'calib', '', 'Hasil');
      if (e.pot && e.calib.status === 'Disetujui' && !e.talentOk) add(`Validasi talent review: ${e.name}`, 'Potensi sudah diisi atasan', 'nav', 'talent', '', 'Talent');
      if (['Diusulkan'].includes(e.reward.status)) add(`Approve merit: ${e.name}`, 'Usulan dari atasan', 'nav', 'reward', '', 'Reward');
    });
    const miss = Object.entries(DB.sharing).filter(([, k]) => kpiCalc(k).missing.length && k.period === 'Monthly');
    miss.forEach(([key, k]) => add(`Lengkapi realisasi Sharing KPI: ${key === 'company' ? 'Perusahaan' : key}`, `${kpiCalc(k).missing.length} bulan kosong`, 'nav', 'sharing', '', 'Realisasi'));
  }
  return T;
}

const SATRIA_META = {

}

  const pk = groupScore(e.pa.mgr, 'PK'), vd = groupScore(e.pa.mgr, 'VD');

  ${hideQual ? `<div class="mt">${note('Nilai kualitatif dan skor akhir ditampilkan setelah kalibrasi disetujui dan hasil dirilis HC. Skor KPI di bawah dihitung langsung dari realisasimu.')}</div>` : ''}
  <div class="card mt"><div class="card-h"><div><h2>1 · Skor KPI</h2><p>Skor tiap KPI dari pencapaian (band skor di Pengaturan) lalu dirata-rata berbobot</p></div><button class="btn sm ghost" data-action="tab" data-k="tab" data-v="ipe">Lihat realisasi</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>KPI</th><th class="r">Bobot</th><th class="r">Pencapaian</th><th class="r">Skor</th><th class="r">Skor × bobot</th></tr></thead><tbody>${kpiRows || `<tr><td colspan="5">${empty('Belum ada KPI.')}</td></tr>`}</tbody></table></div>
    <div class="formula mt">Skor KPI = Σ(skor × bobot) ÷ Σ bobot = ${fmt(kt.ks.reduce((a, k) => a + (k.c.ach == null ? c.kpiBands[c.kpiBands.length - 1].score : k.c.score) * k.w, 0), 2)} ÷ ${kt.tw} = <code>${fmt(kt.score, 3)}</code>${kt.noData && kt.score != null ? ` · <span style="color:var(--maroon)">${kt.noData} KPI belum ada realisasi (dihitung skor ${c.kpiBands[c.kpiBands.length - 1].score})</span>` : ''}<br>Pencapaian IPE (informasi) = Σ(pencapaian × bobot) ÷ Σ bobot = <code>${kt.ipe == null ? '–' : fmt(kt.ipe) + '%'}</code></div>
    <p class="hint mt-s">Band skor KPI: ${c.kpiBands.map(b => b.min > -1e8 ? `≥${b.min}% = ${b.score}` : `lainnya = ${b.score}`).join(' · ')}</p></div>
  ${hideQual ? '' : `<div class="card mt"><h2>2 · Kualitatif</h2><div class="tbl-wrap mt"><table><thead><tr><th>Komponen</th><th>Perhitungan</th><th class="r">Nilai</th></tr></thead><tbody>
