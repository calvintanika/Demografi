/* ---------- IPP ---------- */
function ippStepper(st) {
  const flow = ['Draft', 'Waiting manager', 'Waiting HC', 'Approved'], cur = st === 'Returned' ? 0 : flow.indexOf(st);
  return `<div class="stepper" style="margin-top:0">${[['Draft', 'Karyawan membuat'], ['Validasi atasan', 'Atasan langsung'], ['Validasi HC', 'HC Performance'], ['Disetujui', 'IPP dikunci']].map(([n, d], i) => `<div class="st ${i < cur || st === 'Approved' ? 'done' : i === cur ? 'on prog' : ''}" style="cursor:default"><i>${i < cur || st === 'Approved' ? '✓' : i + 1}</i><span><b>${n}</b><small>${i === 0 && st === 'Returned' ? 'Dikembalikan — revisi' : d}</small></span></div>`).join('')}</div>`;
}
function tgtText(g) {
  if (g.period === 'Yearly') return fmtVal(g, g.target);
  const v = (g.targets || []).filter(isNum); if (!v.length) return '<span style="color:var(--maroon)">Belum diisi</span>';
  return v.every(x => +x === +v[0]) ? `${fmtVal(g, v[0])} / bln${v.length < 12 ? ` (${v.length} bln)` : ''}` : `${fmtVal(g, v[0])} … ${fmtVal(g, v[v.length - 1])}`;
}
function goalTable(e, edit) {
  const row = (g, i, share) => `<tr><td><b style="font-weight:600">${esc(g.name)}</b><br><span class="small muted">${esc(g.desc || '')}</span>${share ? '' : g.tpl ? `<br><span class="chip pink" style="margin-top:4px">${esc(TPL_LABEL[g.tpl] || 'Custom')}</span>` : ''}</td><td>${share ? `<span class="chip navy">Sharing</span>` : `<span class="chip pink">Focus</span>`}</td><td>${esc(g.uom)}</td><td>${g.ttype}</td><td><span class="chip navy" title="${esc(CAT[g.cat].d)}">${g.cat}</span></td><td>${g.period === 'Monthly' ? 'Bulanan' : 'Tahunan'}</td><td title="${esc(FORMULA[g.formula])}">${g.formula}</td><td class="r">${g.w}%</td><td class="r">${tgtText(g)}</td>${edit ? `<td class="r" style="white-space:nowrap">${share ? '<span class="small muted">dari HC</span>' : `<button class="btn sm ghost" data-action="goalEdit" data-v="${i}">Ubah</button> <button class="btn sm link" data-action="goalDel" data-v="${i}">Hapus</button>`}</td>` : ''}</tr>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>KPI</th><th>Tipe</th><th>UoM</th><th>Pct/Abs</th><th>Kategori</th><th>Periode target</th><th>Formula</th><th class="r">Bobot</th><th class="r">Target</th>${edit ? '<th></th>' : ''}</tr></thead><tbody>
  ${sharingFor(e).map(s => row(s.k, -1, true)).join('')}${e.ipp.goals.map((g, i) => row(g, i, false)).join('') || `<tr><td colspan="10">${empty('Belum ada Focus KPI. Tambah KPI sendiri atau mulai dari contoh KPI peran.')}</td></tr>`}</tbody></table></div>`;
}
const checksHtml = e => `<div class="checks">${ippChecks(e).map(c => `<span class="${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '!'} ${c.msg}</span>`).join('')}</div>`;
const historyHtml = list => list.length ? `<div class="tl">${list.slice().reverse().map(h => `<div class="tl-i ${/Divalidasi|dikunci|Disetujui/.test(h.what) ? 'green' : /Dikembalikan|dibuka/i.test(h.what) ? 'pink' : ''}"><b>${esc(h.what)}</b><p>${esc(h.who)} · ${esc(h.at)}</p>${h.note ? `<div class="quote">${esc(h.note)}</div>` : ''}</div>`).join('')}</div>` : '<p class="small muted">Belum ada riwayat.</p>';
function empIpp(e) {
  const ip = e.ipp, edit = isSelf(e) && ['Draft', 'Returned'].includes(ip.status), checks = ippChecks(e), ok = checks.every(c => c.ok);
  const mine = (isMgr(e) && ip.status === 'Waiting manager') || (isHC() && ip.status === 'Waiting HC');
  const lastRet = ip.history.filter(h => /Dikembalikan/.test(h.what)).pop();
  return `${ip.status === 'Returned' && lastRet ? `<div class="mb">${note(`<b>Dikembalikan oleh ${esc(lastRet.who)}:</b> ${esc(lastRet.note || '')}`, 'warn')}</div>` : ''}
  <div class="card">${ippStepper(ip.status)}</div>
  <div class="grid g-main mt"><div class="card"><div class="card-h"><div><h2>KPI FY${CFG().fy} (IPP)</h2><p>Sharing KPI diturunkan dari perusahaan & departemen. Focus KPI dibuat sendiri oleh karyawan.</p></div>
    ${edit ? `<div class="row"><button class="btn ghost" data-action="goalTpl">Gunakan contoh KPI peran</button><button class="btn" data-action="goalAdd">Tambah KPI</button></div>` : ippChip(ip.status)}</div>
    ${goalTable(e, edit)}
    <div class="row between mt"><span class="small"><b>Total bobot ${fmt(ippWeight(e), 0)}%</b> · ${ip.goals.length} Focus KPI</span>
    ${edit ? `<button class="btn" data-action="goalSubmit" ${ok ? '' : 'disabled'} title="${ok ? '' : 'Semua cek otomatis harus lolos'}">${ip.status === 'Returned' ? 'Kirim ulang ke atasan' : 'Kirim ke atasan'}</button>` : ''}
    ${isHC() && ip.status === 'Approved' ? `<button class="btn ghost sm" data-action="ippReopen" data-v="${e.id}">Buka kembali IPP (revisi)</button>` : ''}</div>
    ${mine ? `<div class="divider"></div><label class="f">Catatan untuk karyawan<small>Wajib saat mengembalikan. Validator tidak mengubah KPI — minta perubahan lewat catatan.</small><textarea rows="3" id="goal-note" placeholder="mis. Target terlalu rendah dibanding tahun lalu."></textarea></label>
    <div class="row mt" style="justify-content:flex-end"><button class="btn ghost" data-action="goalReturn" data-v="${e.id}">Kembalikan untuk revisi</button><button class="btn" data-action="goalApprove" data-v="${e.id}" ${ok ? '' : 'disabled'}>${isHC() ? 'Validasi & kunci IPP' : 'Setujui & kirim ke HC'}</button></div>${ok ? '' : '<p class="hint mt-s">Tombol setuju aktif setelah semua cek otomatis lolos. Kembalikan ke karyawan untuk diperbaiki.</p>'}` : ''}
    ${!edit && !mine && ip.status !== 'Approved' ? `<p class="hint mt">${ip.status === 'Draft' || ip.status === 'Returned' ? 'Menunggu karyawan menyusun dan mengirim KPI.' : `Menunggu validasi ${ip.status === 'Waiting HC' ? 'HC' : 'atasan'}.`}</p>` : ''}</div>
  <div class="stack"><div class="card"><h2>Cek otomatis</h2><p class="small muted mt-s">Harus lolos semua sebelum dikirim & disetujui.</p><div class="mt">${checksHtml(e)}</div></div>
  <div class="card"><h2>Riwayat validasi</h2><div class="mt">${historyHtml(ip.history)}</div></div></div></div>`;
}

/* ---------- IPE (realisasi bulanan) ---------- */
function cellState(k, i, share) {
  if (i > CFG().cutoff) return 'Future';
  if (k.period === 'Monthly' && !isNum(k.targets[i])) return 'None';
  const s = k.mstat[i];
  if (s === 'Approved') return 'Approved'; if (s === 'Submitted') return 'Submitted'; if (s === 'Returned') return 'Returned';
  return isNum(k.actuals[i]) ? 'Draft' : 'Empty';
}
function monthStrip(e, k, share) {
  const canInput = !share && isSelf(e), canAppr = !share && isMgr(e), canHC = share && isHC();
  return `<div class="ms-grid">${MONTHS.map((m, i) => {
    const st = cellState(k, i, share), v = k.actuals[i], t = k.period === 'Monthly' ? k.targets[i] : null;
    const cls = { Approved: 'lock', Submitted: 'pend', Returned: 'miss', Draft: 'open', Empty: 'open', Future: 'fut', None: 'none' }[st];
    const editable = (canInput && ['Draft', 'Empty', 'Returned'].includes(st)) || (canHC && !['Future', 'None'].includes(st));
    const lbl = { Approved: 'Disetujui', Submitted: canAppr ? '' : 'Menunggu', Returned: 'Dikembalikan', Draft: share ? 'Tersimpan' : 'Belum dikirim', Empty: '', Future: 'Belum dibuka', None: 'Tanpa target' }[st];
    return `<div class="mcell ${cls}" title="${m}: ${st}${k.mnote && k.mnote[i] ? ' · ' + esc(k.mnote[i]) : ''}"><span class="mm">${m}</span>${t != null && isNum(t) ? `<span class="mt">T ${shortNum(k, t)}</span>` : ''}
      ${editable ? `<input class="inp" type="number" step="any" value="${isNum(v) ? v : ''}" placeholder="–" data-bind="${share ? 'shact' : 'act'}:${e ? e.id : ''}:${share ? k.shareKey : k.id}:${i}" aria-label="${esc(k.name)} ${m}">` : `<b>${st === 'None' ? '·' : isNum(v) ? shortNum(k, v) : st === 'Future' ? '' : '–'}</b>`}
      <span class="ms-st">${lbl}</span>${canAppr && st === 'Submitted' ? `<span class="row" style="gap:3px;justify-content:center"><button class="btn sm" data-action="ipeOk" data-v="${e.id}:${k.id}:${i}" title="Setujui">✓</button><button class="btn sm ghost" data-action="ipeRet" data-v="${e.id}:${k.id}:${i}" title="Kembalikan">↩</button></span>` : ''}</div>`;
  }).join('')}</div>`;
}
function kpiRow(e, k, share = false) {
  const key = (e ? e.id : 'sh') + k.id, open = S.kpiOpen[key], c = k.c || kpiCalc(k);
  return `<div class="krow"><div class="krow-h" data-action="kpiToggle" data-v="${key}" role="button" aria-expanded="${!!open}">
    <div style="min-width:0"><b>${esc(k.name)}</b><div class="small muted">${esc(k.desc || '')}</div>
    <div class="pills mt-s"><span class="chip">UoM: ${esc(k.uom)}</span><span class="chip">${k.ttype}</span><span class="chip navy" title="${esc(CAT[k.cat].d)}">${k.cat}</span><span class="chip">${k.period === 'Monthly' ? 'Target bulanan' : 'Target tahunan'}</span><span class="chip" title="${esc(FORMULA[k.formula])}">${k.formula}</span>${c.missing.length && c.filled ? `<span class="chip red">${c.missing.length} bln kosong</span>` : ''}</div></div>
    <div class="kfig"><span>Bobot<b>${k.w}%</b></span><span>Target YTD<b>${fmtVal(k, c.t)}</b></span><span>Realisasi YTD<b>${fmtVal(k, c.a)}</b></span><span>Pencapaian<b style="color:${c.ach == null ? 'var(--muted)' : c.ach >= 100 ? 'var(--blue)' : 'var(--magenta)'}">${c.ach == null ? '–' : fmt(c.ach) + '%'}</b></span><span>Skor<b>${c.score == null ? '–' : scoreB(c.score, 1)}</b></span><span class="kchev">${open ? '▲' : '▼'}</span></div></div>
    ${open ? `<div class="kbody">${k.period === 'Yearly' ? `<p class="small muted mb">Target tahunan <b>${fmtVal(k, k.target)}</b>. Isi realisasi di bulan terjadinya.</p>` : ''}${monthStrip(e, k, share)}
    ${!share && isSelf(e) ? `<div class="row mt-s"><button class="btn sm ghost" data-action="ipeFill" data-v="${e.id}:${k.id}">Isi bulan kosong = target</button><button class="btn sm link" data-action="ipeClear" data-v="${e.id}:${k.id}">Kosongkan yang belum dikirim</button></div>` : ''}
    ${calcBox({ ...k, c })}</div>` : ''}</div>`;
}
function empIpe(e) {
  if (e.ipp.status !== 'Approved') return `<div class="card">${empty(`Realisasi bulanan dibuka setelah IPP disetujui HC. Status IPP sekarang: <b>${IPP_LBL[e.ipp.status]}</b>.`, `<button class="btn" data-action="tab" data-k="tab" data-v="ipp">Buka IPP</button>`)}</div>`;
  const kt = kpiTotal(e), st = ipeStatus(e), draft = e.ipp.goals.reduce((a, k) => a + k.mstat.filter((s, i) => (s === '' || s === 'Returned') && isNum(k.actuals[i]) && i <= CFG().cutoff).length, 0);
  const sub = st.sub;
  const groups = [['Sharing', 'Sharing KPI', 'Diturunkan dari perusahaan / departemen · realisasi diinput HC'], ['Focus', 'Focus KPI', 'KPI individu · realisasi diinput karyawan, disetujui atasan']];
  return `<div class="grid g5 mb">${[['Jumlah KPI', kt.ks.length], ['Total bobot', kt.tw + '%'], ['Pencapaian IPE', kt.ipe == null ? '–' : fmt(kt.ipe, 1) + '%'], ['Skor KPI (1–5)', fmt(kt.score)], ['Sel disetujui', `${st.appr} / ${st.need}`]].map(x => `<div class="tile"><span class="small muted">${x[0]}</span><div style="font-size:18px;font-weight:700">${x[1]}</div></div>`).join('')}</div>
  ${isSelf(e) && (draft || st.empty) ? `<div class="banner mb"><span><b>${draft}</b> realisasi belum dikirim · <b>${st.empty}</b> sel bulan masih kosong (periode s/d ${MONTHS[CFG().cutoff]} ${CFG().fy}).</span><button class="btn sm" data-action="ipeSubmit" data-v="${e.id}" ${draft ? '' : 'disabled'}>Kirim ${draft} realisasi ke atasan</button></div>` : ''}
  ${isMgr(e) && sub ? `<div class="banner mb"><span><b>${sub}</b> realisasi menunggu approval kamu.</span><button class="btn sm" data-action="ipeOkAll" data-v="${e.id}">Setujui semua</button></div>` : ''}
  ${groups.map(([g, title, subt]) => { const ks = kt.ks.filter(k => k.type === g); return `<div class="kgroup"><div class="row"><span class="kg-badge ${g === 'Sharing' ? 'sh' : 'fo'}">${g[0]}</span><div><b>${title}</b><div class="small muted">${subt} · ${ks.length} KPI · bobot ${ks.reduce((a, k) => a + k.w, 0)}%</div></div></div>${ks.map(k => kpiRow(e, k, g === 'Sharing')).join('')}</div>`; }).join('')}
  <p class="hint">Klik KPI untuk membuka 12 bulan realisasi dan rincian hitungnya. Bulan setelah ${MONTHS[CFG().cutoff]} belum dibuka (atur di Pengaturan Siklus).</p>`;
}

/* ---------- Penilaian (PA) ---------- */
function rateCell(e, b, kind, editable) {
  const v = e.pa[kind][b.id];
  if (!editable) return isNum(v) ? `<span class="score-badge">${v}</span>` : '<span class="muted">–</span>';
  return `<div class="rate" role="radiogroup" aria-label="${esc(b.name)}">${[1, 2, 3, 4, 5].map(n => `<button class="${+v === n ? 'on' : ''}" data-action="rate" data-v="${e.id}:${kind}:${b.id}:${n}" title="${RATING_LV[n - 1][1]} — ${RATING_LV[n - 1][2]}" aria-pressed="${+v === n}">${n}</button>`).join('')}</div>`;
}
function empPa(e) {
  if (e.ipp.status !== 'Approved') return `<div class="card">${empty('Penilaian akhir tahun dibuka setelah IPP disetujui.')}</div>`;
  const self = isSelf(e), mgr = isMgr(e), selfEdit = self && !e.pa.selfSubmitted, mgrEdit = mgr && e.pa.selfSubmitted && !e.pa.mgrSubmitted;
  const showMgr = !self || e.released, s = scoresOf(e), sd = strengthsDev(e);
  const rated = k => BEHAVIORS.filter(b => isNum(e.pa[k][b.id])).length;
  const groupsHtml = QUAL_GROUPS.map(g => `<div class="qgroup"><div class="qg-h"><b>${g.name} · bobot ${g.w}%</b><span class="small muted">Self ${fmt(groupScore(e.pa.self, g.key))}${showMgr ? ` · Atasan ${fmt(groupScore(e.pa.mgr, g.key))}` : ''}</span></div>
    <div class="tbl-wrap" style="border:0;border-radius:0"><table><thead><tr><th>Perilaku</th><th class="r">Bobot</th><th>Self</th>${showMgr ? '<th>Atasan</th>' : ''}</tr></thead><tbody>
    ${BEHAVIORS.filter(b => b.g === g.key).map(b => `<tr><td><b style="font-weight:600">${b.name}</b><br><span class="small muted">${b.def}</span></td><td class="r">${b.w}</td><td>${rateCell(e, b, 'self', selfEdit)}</td>${showMgr ? `<td>${rateCell(e, b, 'mgr', mgrEdit)}</td>` : ''}</tr>`).join('')}</tbody></table></div></div>`).join('');
  const refl = [['acc', 'Pencapaian utama', 'Satu pencapaian per baris — dua teratas tampil di Talent Passport'], ['chal', 'Tantangan', ''], ['sup', 'Dukungan yang dibutuhkan', ''], ['fut', 'Fokus tahun depan', '']];
  const stateBanner = self ? (!e.pa.selfSubmitted ? `Isi rating 1–5 untuk ${BEHAVIORS.length} perilaku dan refleksi, lalu kirim ke atasan. Tersimpan otomatis.` : !e.pa.mgrSubmitted ? 'Self assessment terkirim. Menunggu penilaian atasan.' : !e.released ? 'Atasan sudah menilai. Hasil final tampil setelah kalibrasi disetujui dan dirilis HC.' : 'Hasil final sudah dirilis.')
    : mgr ? (!e.pa.selfSubmitted ? 'Menunggu karyawan mengirim self assessment.' : !e.pa.mgrSubmitted ? 'Beri rating 1–5 tiap perilaku dan ringkasan, lalu kirim. Skor langsung terhitung di bawah.' : 'Penilaian terkirim ke HC untuk kalibrasi.') : `Self: ${e.pa.selfSubmitted ? 'terkirim' : 'belum'} · Atasan: ${e.pa.mgrSubmitted ? 'terkirim' : 'belum'}`;
  const result = (!self || e.released) && s.final != null ? `<div class="card mt"><div class="card-h"><div><h2>Hasil kinerja FY${CFG().fy}</h2><p>${s.frozen ? 'Final — sudah dikalibrasi' : 'Sementara — sebelum kalibrasi disetujui'}</p></div>${bandChip(s.final)}</div>
    <div class="grid g4">${stat(fmt(s.kpi), 'Skor KPI', `bobot ${CFG().weights.kpi}%`)}${stat(fmt(s.qual), 'Kualitatif', `bobot ${CFG().weights.qual}%`)}${stat(fmt(s.overall), 'Sebelum kalibrasi')}${stat(fmt(s.final), 'Skor final', bandOf(s.final).name, 'up')}</div>
    <div class="grid g2 mt"><div><h3>Kekuatan</h3>${sd.strengths.map(x => `<p class="small mt-s">🌟 <b>${x.name}</b> · ${fmt(x.v)} <span class="muted">(${x.src})</span></p>`).join('')}</div><div><h3>Area pengembangan</h3>${sd.dev.map(x => `<p class="small mt-s">🌱 <b>${x.name}</b> · ${fmt(x.v)} → target ${fmt(x.target, 1)} <span class="muted">(${x.src})</span></p>`).join('') || '<p class="small muted mt-s">Tidak ada item di bawah ambang development.</p>'}</div></div>
    ${e.pa.mgrSummary && (self ? e.released : true) ? `<div class="quote mt">${esc(e.pa.mgrSummary)}<small>Ringkasan atasan</small></div>` : ''}
    ${self && e.released ? `<div class="row mt">${e.confirmed ? chip('Dikonfirmasi', 'Sudah kamu konfirmasi') : `<button class="btn" data-action="confirmResult" data-v="${e.id}">Konfirmasi hasil</button>`}<button class="btn ghost" data-action="nav" data-v="passport">${I.pass} Buka Talent Passport</button></div>` : ''}
    ${rewardStatement(e)}</div>` : '';
  return `<div class="banner mb"><span>${stateBanner}</span>${self ? `<span class="small muted">Rating self ${rated('self')}/${BEHAVIORS.length}</span>` : `<span class="small muted">Self ${rated('self')}/${BEHAVIORS.length} · Atasan ${rated('mgr')}/${BEHAVIORS.length}</span>`}</div>
  <div class="card"><div class="card-h"><div><h2>Kompetensi & nilai SATRIA</h2><p>Skala: ${RATING_LV.map(r => `${r[0]} ${r[1]}`).join(' · ')}</p></div></div>${groupsHtml}</div>
  <div class="card mt"><h2>Refleksi karyawan</h2><div class="grid g2 mt">${refl.map(([k, l, h]) => `<label class="f">${l}${h ? `<small>${h}</small>` : ''}<textarea rows="3" data-bind="refl:${e.id}:${k}" ${selfEdit ? '' : 'readonly'}>${esc(e.pa.refl[k])}</textarea></label>`).join('')}</div></div>
  ${showMgr ? `<div class="card mt"><h2>Ringkasan atasan</h2><label class="f mt"><textarea rows="3" data-bind="msum:${e.id}" ${mgrEdit ? '' : 'readonly'} placeholder="Kekuatan, area pengembangan, dan fokus tahun depan">${esc(e.pa.mgrSummary)}</textarea></label></div>` : ''}
  <div class="foot-bar"><span class="small muted" style="flex:1">${e.pa.selfAt ? `Self terkirim ${esc(e.pa.selfAt)}` : 'Self belum dikirim'}${e.pa.mgrAt ? ` · atasan ${esc(e.pa.mgrAt)}` : ''}</span>
    ${selfEdit ? `<button class="btn" data-action="selfSubmit" data-v="${e.id}">Kirim self assessment</button>` : ''}
    ${mgrEdit ? `<button class="btn" data-action="mgrSubmit" data-v="${e.id}">Kirim penilaian ke HC</button>` : ''}
    ${isHC() && (e.pa.selfSubmitted || e.pa.mgrSubmitted) && e.calib.status !== 'Disetujui' ? `<button class="btn ghost sm" data-action="paReopen" data-v="${e.id}">Buka kembali penilaian</button>` : ''}</div>
  ${result}`;
}
function rewardStatement(e) {
  if (!(CFG().rewardReleased && e.reward.status === 'Dikirim ke payroll')) return '';
  const r = rewardOf(e); if (!r) return '';
  return `<div class="card mt" style="background:var(--surface-2)"><div class="card-h"><div><h3>Reward statement FY${CFG().fy}</h3><p class="small muted">Rahasia · efektif 1 Mar ${CFG().fy + 1}</p></div></div>
  <div class="grid g3">${stat(fmt(r.pct, 1) + '%', 'Kenaikan merit')}${stat(rp(r.newSal), 'Gaji baru / bulan', 'dari ' + rp(e.salary))}${stat(rp(r.bonus), 'Bonus kinerja')}</div>
  <div class="formula mt">Bonus = ${rp(e.salary)} × ${r.months} bulan × perusahaan ${CFG().companyAch}% × individu ${r.mult} = <code>${rp(r.bonus)}</code></div></div>`;

/* ---------- 360 ---------- */
function emp360(e) {
  const as = assessorsOf(e), f = f360Of(e), anon = isSelf(e);
  return `<div class="grid g-main"><div class="card"><div class="card-h"><div><h2>Feedback 360</h2><p>${CFG().use360 ? `Masuk ke nilai kualitatif dengan bobot ${CFG().qualMix.f360}%` : '360 dinonaktifkan di Pengaturan — hanya informasi'}</p></div>${f.avg != null ? scoreB(f.avg) : ''}</div>
    ${f.n ? radar(f.items.map(i => ({ name: i.name, v: i.v || 0 }))) : empty('Belum ada feedback 360 yang masuk.')}
    ${f.n ? `<div class="tbl-wrap mt"><table><thead><tr><th>Item</th><th class="r">Rata-rata</th></tr></thead><tbody>${f.items.map(i => `<tr><td>${i.name}</td><td class="r">${fmt(i.v)}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>
  <div class="stack"><div class="card"><h2>Penilai</h2><p class="small muted mt-s">Otomatis: 2 rekan satu tim + 1 lintas fungsi.${anon ? ' Nama penilai disembunyikan.' : ''}</p>
    ${as.map((a, i) => { const r = e.f360.find(x => x.from === a.id), p = empOf(a.id); return `<div class="act"><div class="who" style="flex:1">${anon ? `<span class="avatar" style="background:var(--faint)">${i + 1}</span><div><b>${a.rel} ${i + 1}</b><small>Anonim</small></div>` : `${av(p.name)}<div><b>${esc(p.name)}</b><small>${a.rel}</small></div>`}</div>${r ? chip('Selesai', 'Masuk') : chip('Menunggu')}${!r && isHC() ? `<button class="btn sm ghost" data-action="remind" data-v="${esc(p.name)}">Ingatkan</button>` : ''}</div>`; }).join('') || empty('Belum ada penilai (tim terlalu kecil).')}</div>
  <div class="card"><h2>Komentar</h2>${e.f360.map(r => `<div class="quote">${esc(r.c || '—')}<small>${anon ? r.rel : `${esc(empOf(r.from)?.name || r.from)} · ${r.rel}`} · ${esc(r.at)}</small></div>`).join('') || '<p class="small muted mt-s">Belum ada komentar.</p>'}</div></div></div>`;
}

/* ---------- IDP ---------- */
function idpStatus(p) { return p >= 100 ? 'Selesai' : p > 0 ? 'Berjalan' : 'Direncanakan'; }
function empIdp(e) {
  const sd = strengthsDev(e), can = isSelf(e) || isMgr(e) || isHC();
  return `<div class="grid g-main"><div class="card"><div class="card-h"><div><h2>Rencana pengembangan (IDP)</h2><p>Progres tampil di Talent Passport bagian "My growth"</p></div>${can ? `<button class="btn" data-action="idpNew" data-v="${e.id}">Tambah rencana</button>` : ''}</div>
    ${e.idp.length ? e.idp.map((d, i) => `<div class="idp-card"><div class="row between"><div><b>${esc(d.need)}</b> <span class="chip">${esc(d.method)}</span> ${chip(idpStatus(d.progress))}<div class="small muted mt-s">${esc(d.action)} · PIC ${esc(d.owner)} · target ${esc(d.date)}</div><div class="small mt-s">Tujuan: ${esc(d.goal)}</div></div>${isMgr(e) || isHC() ? `<button class="btn sm link" data-action="idpDel" data-v="${e.id}:${i}">Hapus</button>` : ''}</div>
      <div class="row mt-s" style="flex-wrap:nowrap"><input type="range" min="0" max="100" step="5" value="${d.progress}" data-bind="idpp:${e.id}:${i}" ${can ? '' : 'disabled'} aria-label="Progres ${esc(d.need)}"><b class="num" data-out="idpp:${e.id}:${i}" style="min-width:44px;text-align:right">${d.progress}%</b></div>
      ${isNum(d.current) ? `<p class="hint">Nilai saat ini ${fmt(d.current)} → target ${fmt(d.target, 1)}</p>` : ''}</div>`).join('') : empty('Belum ada rencana pengembangan.')}</div>
  <div class="card"><h2>Kebutuhan development</h2><p class="small muted mt-s">Item dengan nilai di bawah ${CFG().devThreshold} (dari rating atasan & 360)</p>
    ${sd.dev.map(x => `<div class="act"><div class="act-main"><b>${x.name}</b><span class="small muted">${x.src} · ${fmt(x.v)} → ${fmt(x.target, 1)} · saran: ${esc(IDP_REC[x.name] || 'Coaching')}</span></div>${can ? `<button class="btn sm ghost" data-action="idpNew" data-v="${e.id}" data-n="${esc(x.name)}">Buat rencana</button>` : ''}</div>`).join('') || `<div class="mt">${empty(e.pa.mgrSubmitted ? 'Tidak ada item di bawah ambang.' : 'Muncul setelah atasan menilai.')}</div>`}</div></div>`;
}

/* ---------- Talent & reward (atasan/HC) ---------- */
function empTalent(e) {
  const t = talentOf(e), r = rewardOf(e);
  return `<div class="grid g2"><div class="card"><div class="card-h"><div><h2>Asesmen potensi</h2><p>Diisi atasan · divalidasi HC</p></div><button class="btn sm" data-action="potential" data-v="${e.id}">${e.pot ? 'Ubah potensi' : 'Isi potensi'}</button></div>
    ${e.pot ? POT_CRIT.map(([k, l, d]) => `<div class="mt-s"><div class="row between small"><b>${l}</b><span>${fmt(e.pot[k], 1)}</span></div><div class="bar mt-s"><i style="width:${e.pot[k] / 5 * 100}%"></i></div><span class="hint">${d}</span></div>`).join('') : empty('Belum diisi.')}
    <dl class="kv mt"><dt>Rata-rata potensi</dt><dd>${fmt(t.pot)}</dd><dt>Flight risk</dt><dd>${esc(e.risk)}</dd><dt>Aspirasi</dt><dd>${esc(e.asp || '–')}</dd><dt>9-box</dt><dd>${t.nine ? `<span class="chip pink">${t.nine.n}</span>${t.provisional ? ' <span class="chip amber">Sementara</span>' : ''}` : '–'}</dd><dt>HAV</dt><dd>${t.hav ? t.hav.n : '–'}</dd><dt>Validasi HC</dt><dd>${e.talentOk ? chip('Disetujui') : chip('Menunggu')}</dd></dl>
    ${t.nine ? `<p class="hint mt">${t.nine.a}. Penempatan box tidak ditampilkan ke karyawan maupun di Talent Passport.</p>` : ''}</div>
  <div class="card"><div class="card-h"><div><h2>Reward</h2><p>Dari rating final & posisi gaji di range</p></div><button class="btn sm ghost" data-action="nav" data-v="reward">Buka Reward</button></div>
    ${r ? `<dl class="kv"><dt>Rating</dt><dd>${r.band.name}</dd><dt>Gaji / midpoint</dt><dd>${rp(e.salary)} / ${rp(e.mid)}</dd><dt>Compa-ratio</dt><dd>${fmt(r.cr)} (${COMPA_LBL[compaIdx(r.cr)]})</dd><dt>Guideline merit</dt><dd>${fmt(r.guide, 1)}%</dd><dt>Usulan merit</dt><dd>${fmt(r.pct, 1)}%</dd><dt>Gaji baru</dt><dd>${rp(r.newSal)}</dd><dt>Bonus</dt><dd>${rp(r.bonus)}</dd><dt>Status</dt><dd>${chip(e.reward.status)}</dd></dl>
    <div class="formula mt">Bonus = ${rp(e.salary)} × ${r.months} bln (grade ${e.grade}) × ${CFG().companyAch}% × ${r.mult} = <code>${rp(r.bonus)}</code></div>${scoresOf(e).frozen ? '' : `<p class="hint mt-s">Sementara — rating belum final.</p>`}` : empty('Muncul setelah skor akhir tersedia.')}</div></div>`;
}
function empLog(e) {
  const a = DB.audit.filter(x => (x.what + ' ' + x.why).includes(e.name));
  return `<div class="grid g2"><div class="card"><h2>Riwayat IPP</h2><div class="mt">${historyHtml(e.ipp.history)}</div></div><div class="card"><h2>Audit trail</h2><div class="mt">${historyHtml(a.map(x => ({ at: x.at, who: x.who, what: x.what, note: x.why })))}</div></div></div>`;
}

/* =====================================================================
   VALIDASI & APPROVAL · FEEDBACK 360 · KALIBRASI · TALENT · REWARD · IDP
   ===================================================================== */
VIEWS.approvals = function () {
  const admin = isHC(), list = scopeEmps();
  if (admin) S.aprTab = 'ipp';
  const T = admin ? [['ipp', 'Validasi IPP']] : [['ipp', 'Validasi IPP'], ['ipe', 'Approval realisasi'], ['pa', 'Penilaian tim']];
  const tab = T.some(t => t[0] === S.aprTab) ? S.aprTab : 'ipp';
  let body = '';
  if (tab === 'ipp') {
    const mine = admin ? 'Waiting HC' : 'Waiting manager', f = S.f.ipp || 'Perlu aksi';
    const cnt = s => list.filter(e => e.ipp.status === s).length;
    const rows = list.filter(e => f === 'Semua' || (f === 'Perlu aksi' ? e.ipp.status === mine : e.ipp.status === f));
    body = `<div class="grid g5 mb">${['Draft', 'Waiting manager', 'Waiting HC', 'Returned', 'Approved'].map(s => `<button class="tile ${s === mine ? 'hl' : ''} clickable" data-action="filt" data-k="ipp" data-v="${s}"><span class="small muted">${IPP_LBL[s]}</span><div class="big">${cnt(s)}</div></button>`).join('')}</div>
    <div class="card"><div class="card-h"><div><h2>${admin ? 'Validasi HC' : 'Validasi KPI tim'}</h2><p>${admin ? 'IPP yang sudah divalidasi atasan. Cek konsistensi antar departemen, lalu kunci.' : 'KPI dibuat oleh karyawan. Kamu menyetujui atau mengembalikan dengan catatan.'}</p></div>
    <div class="pills">${['Perlu aksi', 'Semua', 'Draft', 'Returned', 'Approved'].map(v => `<button class="${f === v ? 'on' : ''}" data-action="filt" data-k="ipp" data-v="${v}">${v === 'Perlu aksi' ? `Perlu aksi (${cnt(mine)})` : IPP_LBL[v] || v}</button>`).join('')}</div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Karyawan</th>${admin ? '<th>Dept</th>' : ''}<th class="r">Focus KPI</th><th class="r">Total bobot</th><th>Cek</th><th>Status</th><th></th></tr></thead><tbody>
    ${rows.map(e => { const bad = ippChecks(e).filter(c => !c.ok).length; return `<tr class="click" data-action="openEmp" data-v="${e.id}" data-t="ipp"><td>${who(e)}</td>${admin ? `<td>${esc(e.dept)}</td>` : ''}<td class="r">${e.ipp.goals.length}</td><td class="r">${fmt(ippWeight(e), 0)}%</td><td>${bad ? `<span class="chip red">${bad} masalah</span>` : '<span class="chip green">Lolos</span>'}</td><td>${ippChip(e.ipp.status)}</td><td class="r"><button class="btn sm ${e.ipp.status === mine ? '' : 'ghost'}" data-action="openEmp" data-v="${e.id}" data-t="ipp">${e.ipp.status === mine ? 'Review' : 'Lihat'}</button></td></tr>`; }).join('') || `<tr><td colspan="7">${empty('Tidak ada data untuk filter ini.')}</td></tr>`}</tbody></table></div></div>`;
  } else if (tab === 'ipe') {
    body = `<div class="card"><div class="card-h"><div><h2>Approval realisasi bulanan</h2><p>Realisasi yang dikirim karyawan. Setujui per sel di halaman karyawan, atau sekaligus di sini.</p></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Karyawan</th><th class="r">Menunggu</th><th class="r">Disetujui</th><th class="r">Kosong</th><th class="r">Pencapaian IPE</th><th></th></tr></thead><tbody>
    ${list.filter(e => e.ipp.status === 'Approved').map(e => { const st = ipeStatus(e), kt = kpiTotal(e); return `<tr><td>${who(e)}</td><td class="r">${st.sub ? `<b style="color:var(--magenta)">${st.sub}</b>` : 0}</td><td class="r">${st.appr} / ${st.need}</td><td class="r">${st.empty + st.draft}</td><td class="r">${kt.ipe == null ? '–' : fmt(kt.ipe, 1) + '%'}</td><td class="r" style="white-space:nowrap"><button class="btn sm ghost" data-action="openEmp" data-v="${e.id}" data-t="ipe">Buka</button> <button class="btn sm" data-action="ipeOkAll" data-v="${e.id}" ${st.sub ? '' : 'disabled'}>Setujui ${st.sub}</button></td></tr>`; }).join('') || `<tr><td colspan="6">${empty('Belum ada IPP tim yang disetujui.')}</td></tr>`}</tbody></table></div></div>`;
  } else {
    body = `<div class="card"><div class="card-h"><div><h2>Penilaian tim</h2><p>Nilai setelah karyawan mengirim self assessment</p></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Karyawan</th><th>Self assessment</th><th>Penilaian atasan</th><th class="r">Skor KPI</th><th class="r">Kualitatif</th><th class="r">Skor akhir</th><th></th></tr></thead><tbody>
    ${list.map(e => { const s = scoresOf(e); return `<tr class="click" data-action="openEmp" data-v="${e.id}" data-t="pa"><td>${who(e)}</td><td>${e.pa.selfSubmitted ? chip('Selesai', 'Terkirim') : e.ipp.status === 'Approved' ? chip('Berjalan', 'Belum dikirim') : '<span class="muted small">IPP belum disetujui</span>'}</td><td>${e.pa.mgrSubmitted ? chip('Selesai', 'Terkirim') : e.pa.selfSubmitted ? chip('Diusulkan', 'Perlu dinilai') : '–'}</td><td class="r">${fmt(s.kpi)}</td><td class="r">${fmt(s.qual)}</td><td class="r"><b>${fmt(s.final)}</b></td><td class="r"><button class="btn sm ${e.pa.selfSubmitted && !e.pa.mgrSubmitted ? '' : 'ghost'}" data-action="openEmp" data-v="${e.id}" data-t="pa">${e.pa.selfSubmitted && !e.pa.mgrSubmitted ? 'Nilai' : 'Lihat'}</button></td></tr>`; }).join('')}</tbody></table></div></div>`;
  }
  return pageHead(admin ? 'Validasi IPP' : 'Validasi & approval', admin ? 'Tahap terakhir sebelum IPP dikunci' : 'Semua yang menunggu keputusanmu') + tabs('aprTab', T, tab) + body;
};

/* ---------- Feedback 360 (memberi) ---------- */
VIEWS.give = function () {
  const meE = empOf(S.empId);
  const req = DB.emps.filter(x => x.id !== meE.id && x.ipp.status === 'Approved' && assessorsOf(x).some(a => a.id === meE.id));
  const all = DB.emps.filter(x => x.id !== meE.id && assessorsOf(x).some(a => a.id === meE.id));
  return pageHead('Feedback 360', 'Kamu ditunjuk otomatis sebagai penilai. Jawabanmu anonim bagi yang dinilai.') +
    `<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Untuk</th><th>Peran kamu</th><th>Status</th><th></th></tr></thead><tbody>
    ${all.map(x => { const r = x.f360.find(y => y.from === meE.id), open = req.includes(x); return `<tr><td>${who(x)}</td><td>${assessorsOf(x).find(a => a.id === meE.id).rel}</td><td>${r ? chip('Selesai', 'Terkirim ' + r.at) : open ? chip('Menunggu', 'Belum diisi') : '<span class="small muted">Dibuka setelah IPP-nya disetujui</span>'}</td><td class="r"><button class="btn sm ${r ? 'ghost' : ''}" data-action="give360" data-v="${x.id}" ${open ? '' : 'disabled'}>${r ? 'Ubah' : 'Beri feedback'}</button></td></tr>`; }).join('') || `<tr><td colspan="4">${empty('Kamu belum ditunjuk sebagai penilai 360.')}</td></tr>`}</tbody></table></div></div>`;
};

/* ---------- Kalibrasi ---------- */
VIEWS.calib = function () {
  const admin = isHC(), base = scopeEmps().filter(e => e.pa.mgrSubmitted);
  const depts = ['Semua', ...new Set(base.map(e => e.dept))], dept = depts.includes(S.calDept) ? S.calDept : 'Semua';
  const list = base.filter(e => dept === 'Semua' || e.dept === dept);
  const dist = CFG().ratingBands.map(b => list.filter(e => { const s = scoresOf(e); return s.final != null && bandOf(s.final).key === b.key; }).length);
  const waitingMgr = scopeEmps().filter(e => !e.pa.mgrSubmitted).length;
  return pageHead(admin ? 'Kalibrasi & rilis hasil' : 'Kalibrasi', `Hanya karyawan yang sudah dinilai atasan · batas penyesuaian ±${CFG().calibLimit}`, admin ? `<button class="btn ghost" data-action="calibAll">Setujui semua</button><button class="btn" data-action="releaseAll">Rilis semua yang disetujui</button>` : '') +
    `<div class="grid g4">${stat(list.length, 'Siap dikalibrasi')}${stat(list.filter(e => e.calib.status === 'Diusulkan').length, 'Ada usulan atasan')}${stat(list.filter(e => e.calib.status === 'Disetujui').length, 'Disetujui')}${stat(waitingMgr, 'Belum dinilai atasan', 'Belum masuk daftar')}</div>
    <div class="grid g-main mt"><div class="card"><div class="card-h"><div><h2>Distribusi vs guideline</h2><p>Garis putus-putus = guideline distribusi</p></div><div class="pills">${depts.map(d => `<button class="${d === dept ? 'on' : ''}" data-action="calDept" data-v="${esc(d)}">${esc(d)}</button>`).join('')}</div></div>${distChart(dist)}</div>
    <div class="card"><h2>Log kalibrasi</h2><div class="mt" style="max-height:260px;overflow:auto">${historyHtml(DB.audit.slice(-12).map(x => ({ at: x.at, who: x.who, what: x.what, note: x.why })))}</div></div></div>
    <div class="card mt"><div class="tbl-wrap"><table><thead><tr><th>Karyawan</th><th class="r">KPI</th><th class="r">Kualitatif</th><th class="r">Skor</th><th class="r">Penyesuaian</th><th class="r">Final</th><th>Rating</th><th>Status</th><th>Rilis</th><th></th></tr></thead><tbody>
    ${list.map(e => { const s = scoresOf(e), adj = e.calib.adj != null ? e.calib.adj - s.overall : e.calib.status === 'Diusulkan' ? e.calib.propose : 0; const incomplete = !ipeStatus(e).done;
      return `<tr><td>${who(e, e.dept)}${incomplete ? '<br><span class="chip amber" style="margin-top:4px">Realisasi belum lengkap</span>' : ''}</td><td class="r">${fmt(s.kpi)}</td><td class="r">${fmt(s.qual)}</td><td class="r">${fmt(s.overall)}</td><td class="r">${adj ? `<b style="color:var(--magenta)">${adj > 0 ? '+' : ''}${fmt(adj)}</b>${e.calib.status === 'Diusulkan' ? '<br><span class="small muted">usulan</span>' : ''}` : '–'}</td><td class="r"><b>${fmt(s.final)}</b></td><td>${bandChip(s.final)}</td><td>${chip(e.calib.status)}</td><td>${e.released ? chip(e.confirmed ? 'Dikonfirmasi' : 'Dirilis') : '–'}</td>
      <td class="r" style="white-space:nowrap">${e.calib.status !== 'Disetujui' ? `<button class="btn sm ghost" data-action="calibAdj" data-v="${e.id}">${admin ? 'Sesuaikan' : 'Usulkan'}</button>${admin ? ` <button class="btn sm" data-action="calibOk" data-v="${e.id}">Setujui</button>` : ''}` : admin ? `${!e.released ? `<button class="btn sm" data-action="release" data-v="${e.id}">Rilis</button> ` : ''}<button class="btn sm link" data-action="calibReopen" data-v="${e.id}">Buka lagi</button>` : '<span class="small muted">Final</span>'} <button class="btn sm link" data-action="openEmp" data-v="${e.id}" data-t="sum">Detail</button></td></tr>`; }).join('') || `<tr><td colspan="10">${empty('Belum ada karyawan yang selesai dinilai atasan.')}</td></tr>`}</tbody></table></div>
    <p class="hint mt">Setelah disetujui, skor dibekukan (snapshot) sehingga perubahan data berikutnya tidak menggeser hasil final. "Buka lagi" menghapus snapshot untuk pengujian ulang.</p></div>`;
};

/* ---------- Talent Review ---------- */
VIEWS.talent = function () {
  const admin = isHC(), base = scopeEmps().filter(e => scoresOf(e).final != null);
  const list = base.map(e => ({ e, t: talentOf(e) })), placed = list.filter(x => x.t.nine);
  const T = [['nine', '9-box'], ['hav', 'HAV matrix'], ['pool', 'Talent pool'], ['input', 'Input potensi']];
  const tab = T.some(t => t[0] === S.talTab) ? S.talTab : 'nine';
  let body;
  if (tab === 'nine' || tab === 'hav') {
    const key = tab, sel = placed.filter(x => !S.box || x.t[key].n === S.box);
    body = `<div class="grid g-main"><div class="card"><div class="card-h"><div><h2>${tab === 'nine' ? '9-box' : 'HAV (Human Asset Value)'}</h2><p>Kinerja dari skor final · potensi dari asesmen atasan. Klik box atau inisial.</p></div></div>${gridHtml(tab === 'nine' ? NINE : HAV, placed, key)}</div>
    <div class="card"><div class="card-h"><h2>${esc(S.box || 'Semua')}</h2>${S.box ? '<button class="btn link" data-action="talentBox" data-v="">Tampilkan semua</button>' : ''}</div>
    ${sel.map(x => `<div class="act"><div class="who" style="flex:1">${av(x.e.name)}<div><b>${esc(x.e.name)}</b><small>Kinerja ${fmt(x.t.perf)} · potensi ${fmt(x.t.pot)} · ${x.t[key].n}${x.t.provisional ? ' · sementara' : ''}</small></div></div>${x.e.talentOk ? chip('Disetujui') : chip('Menunggu')}<button class="btn sm ghost" data-action="potential" data-v="${x.e.id}">Buka</button></div>`).join('') || '<p class="muted small">Tidak ada orang di box ini.</p>'}
    ${list.length > placed.length ? `<p class="hint mt">${list.length - placed.length} karyawan belum punya asesmen potensi — buka tab Input potensi.</p>` : ''}</div></div>`;
  } else if (tab === 'pool') {
    const pool = placed.filter(x => ['Star', 'High potential', 'High performer'].includes(x.t.nine.n)).sort((a, b) => b.t.pot - a.t.pot);
    body = `<div class="card"><div class="card-h"><div><h2>Talent pool</h2><p>Star, high potential, high performer · bahan promosi, suksesi, proyek kunci</p></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Karyawan</th><th>Box</th><th class="r">Kinerja</th><th class="r">Potensi</th><th>Flight risk</th><th>Aspirasi</th><th>Rekomendasi</th></tr></thead><tbody>
    ${pool.map(x => `<tr class="click" data-action="potential" data-v="${x.e.id}"><td>${who(x.e)}</td><td><span class="chip pink">${x.t.nine.n}</span></td><td class="r">${fmt(x.t.perf)}</td><td class="r">${fmt(x.t.pot)}</td><td>${esc(x.e.risk)}</td><td>${esc(x.e.asp || '–')}</td><td class="small">${x.t.nine.a}</td></tr>`).join('') || `<tr><td colspan="7">${empty('Belum ada karyawan di talent pool.')}</td></tr>`}</tbody></table></div></div>`;
  } else {
    body = `<div class="card"><div class="card-h"><div><h2>Input potensi</h2><p>4 kriteria skala 1–5 · rata-rata = sumbu potensi</p></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Karyawan</th>${POT_CRIT.map(c => `<th class="r">${c[1]}</th>`).join('')}<th class="r">Rata-rata</th><th>9-box</th><th>Validasi HC</th><th></th></tr></thead><tbody>

function reportData(k) {

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]'); if (!el || el.disabled) return;
  const a = el.dataset.action, v = el.dataset.v;
  if (a === 'scrim') { if (ev.target === el) { S.modal = null; render(); } return; }
  if (el.tagName === 'A') ev.preventDefault();
  const fn = ACT[a]; if (!fn) return;
  const before = RENDERS, r = fn(v ?? '', el);
  if (r && typeof r.then === 'function') return;
  if (!NO_RENDER.has(a) && RENDERS === before) render();
});
document.addEventListener('input', ev => {
  const b = ev.target.dataset.bind; if (!b) return; const val = ev.target.value, p = b.split(':');
  if (p[0] === 'refl') { empOf(p[1]).pa.refl[p[2]] = val; save(); }
  else if (p[0] === 'msum') { empOf(p[1]).pa.mgrSummary = val; save(); }
  else if (p[0] === 'gk') S.modal.g[p[1]] = val;
  else if (p[0] === 'gkm') S.modal.g.targets[+p[1]] = val;
  else if (p[0] === 'idpp') { const o = document.querySelector(`[data-out="${b}"]`); if (o) o.textContent = val + '%'; }
  else if (p[0] === 'pot') { S.modal.p[p[1]] = +val; const o = document.querySelector(`[data-out="pot:${p[1]}"]`); if (o) o.textContent = fmt(+val, 1); const a = document.querySelector('[data-out="potavg"]'); if (a) a.textContent = fmt(POT_CRIT.reduce((x, [k]) => x + (+S.modal.p[k] || 0), 0) / 4); }
  else if (p[0] === 'calv') { S.modal.v = +val; const s = liveScores(empOf(S.modal.id)), d = +val - s.overall; document.querySelector('[data-out="calv"]').textContent = fmt(+val); document.querySelector('[data-out="cald"]').textContent = (d >= 0 ? '+' : '') + fmt(d); document.querySelector('[data-out="calb"]').textContent = 'Rating: ' + bandOf(+val).name; }
  else if (p[0] === 'merv') { S.modal.v = +val; document.querySelector('[data-out="merv"]').textContent = fmt(+val, 1); }
  else if (b === 'search') { S.f.q = val; clearTimeout(window._sq); window._sq = setTimeout(render, 250); }
});
document.addEventListener('change', ev => {
  const t = ev.target, b = t.dataset.bind; if (!b) return; const val = t.value, p = b.split(':'), c = CFG();
  const n = val === '' ? null : +val;
  if (b === 'persona') { S.empId = val; if (S.view === 'emp' || S.view === 'pp') S.id = val; render(false); return; }
  if (b === 'mgr') { S.mgrId = val; if (S.view === 'emp' || S.view === 'pp') S.view = 'home'; render(false); return; }
  if (p[0] === 'act') { const k = empOf(p[1]).ipp.goals.find(x => x.id === p[2]), i = +p[3]; k.actuals[i] = n; if (k.mstat[i] !== 'Returned') k.mstat[i] = ''; setTimeout(() => render(), 0); return; }
  if (p[0] === 'shact') { const k = DB.sharing[p[2]], i = +p[3]; k.actuals[i] = n; k.mstat[i] = n == null ? '' : 'Approved'; setTimeout(() => render(), 0); return; }
  if (p[0] === 'idpp') { const e = empOf(p[1]); e.idp[+p[2]].progress = +val; render(); return; }
  if (p[0] === 'gk' || p[0] === 'gkTpl') {
    const g = S.modal.g;
    if (p[0] === 'gkTpl') { const tp = KPI_TEMPLATES.find(x => x.k === val); g.tpl = val; if (tp) Object.assign(g, { uom: g.uom || tp.uom, ttype: tp.ttype, cat: tp.cat, period: tp.period, formula: tp.formula }); }
    else g[p[1]] = val;
    if (g.period === 'Monthly' && !g.targets) g.targets = Array(12).fill('');
    if (['gkTpl'].includes(p[0]) || p[1] === 'period') render();
    return;
  }
  if (b === 'importJson') {
    const f = t.files[0]; if (!f) return;
    f.text().then(txt => { const d = JSON.parse(txt); if (!d || !Array.isArray(d.emps) || !d.cfg || !d.managers) throw new Error('format'); DB = d; S.empId = DB.emps[0]?.id; S.mgrId = DB.managers[0]?.id; toast(`Data diimpor: ${DB.emps.length} karyawan`); }).catch(() => toast('File tidak valid — gunakan file backup dari aplikasi ini'));
    return;
  }
  if (p[0] === 'cfg') {
    const k = p[1];
    if (k === 'use360') c.use360 = t.checked;
    else if (k === 'wKpi') { const v = Math.max(0, Math.min(100, n || 0)); c.weights.kpi = v; c.weights.qual = 100 - v; }
    else if (k === 'wComp') { const v = Math.max(0, Math.min(100, n || 0)); c.qualMix.comp = v; c.qualMix.f360 = 100 - v; }
    else if (n != null) c[k] = n;
  }
  else if (p[0] === 'kb' && n != null) { c.kpiBands[+p[2]][p[1]] = n; c.kpiBands.sort((a, b2) => b2.min - a.min); }
  else if (p[0] === 'rb' && n != null) c.ratingBands[+p[2]][p[1]] = n;
  else if (p[0] === 'tal' && n != null) c.talent[p[1]] = n;
  else if (p[0] === 'merit' && n != null) c.merit[p[1]][+p[2]] = n;
  else if (p[0] === 'mult' && n != null) c.bonusMult[p[1]] = n;
  else return;
  toast('Pengaturan diperbarui — semua angka dihitung ulang');
});

  try { loaded = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { }
  DB = loaded && loaded.v === 1 && Array.isArray(loaded.emps) ? loaded : finalizeSeed(seedDB());
  try { const u = JSON.parse(localStorage.getItem(STORE_KEY + '-ui')); if (u) { S.role = u.role || 'employee'; S.empId = empOf(u.empId) ? u.empId : DB.emps[0]?.id; S.mgrId = mgrById(u.mgrId) ? u.mgrId : DB.managers[0]?.id; } } catch (e) { }
  S.view = S.role === 'admin' ? 'dashboard' : 'home';
  render(false);
})();

</script>
